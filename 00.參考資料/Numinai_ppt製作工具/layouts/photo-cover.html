<title>版型 photo-cover</title>
<!-- 滿版圖封面／示意（hero-photo）：整頁滿版圖（center/cover）＋內建可調深色漸層遮罩，
     壓在標題那一側，確保白字疊在照片上仍清楚可讀。遮罩＋圖都用 inline background 設。
     ⚠ 絕對不要在 section 元素上加 position:relative —— 會覆蓋 .slide 的 position:absolute，整頁變白屏；
        logo 用 position:absolute 即可（定位錨點＝.slide 本身，毋須在 section 加 relative）。
     實務：把 inline background 第二層漸層換成 url('assets/你的封面.jpg')；遮罩深度＝調第一層 rgba 的 alpha。 -->

.probe-photo__logo {position:absolute;top:calc(3 * var(--u));right:var(--edge-x);display:block;

</style>
