<style>
/* Layout: 品牌青綠頁首帶 + 兩欄工具卡（手機單欄），每張卡整塊可點 */
:root {
  --bg: #ECF8F6;
  --surface: #FFFFFF;
  --ink: #1E1E1E;
  --muted: #515151;
  --line: #C0E9E2;
  --accent: #097881;
  --accent-strong: #06565C;
  --accent-soft: #D5F4EF;
  --band: #097881;
  --band-ink: #FFFFFF;
  --font-display: 'Chiron GoRound TC', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1D1D; --surface: #152828; --ink: #E8F3F1; --muted: #A9BDBA; --line: #24403F;
    --accent: #82D3C6; --accent-strong: #C0E9E2; --accent-soft: #1C3634;
    --band: #06565C; --band-ink: #ECF8F6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1D1D; --surface: #152828; --ink: #E8F3F1; --muted: #A9BDBA; --line: #24403F;
  --accent: #82D3C6; --accent-strong: #C0E9E2; --accent-soft: #1C3634;
  --band: #06565C; --band-ink: #ECF8F6; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
}
.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header { background: var(--band); color: var(--band-ink); }
header .wrap { padding-block: 48px 40px; display: grid; gap: 8px; }
.eyebrow {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.12em;
  opacity: 0.85;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.9rem, 5vw, 2.8rem);
  line-height: 1.25;
  text-wrap: balance;
}
header p { margin: 0; max-width: 34em; opacity: 0.9; }

main .wrap { padding-block: 32px 56px; }
.tools {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
@media (max-width: 640px) { .tools { grid-template-columns: 1fr; } }

.tool {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  height: 100%;
  padding: 22px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.tool:hover { border-color: var(--accent); transform: translateY(-2px); }
.tool:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid; place-items: center;
}
.icon svg { width: 28px; height: 28px; }
.text { min-width: 0; display: grid; gap: 2px; }
.name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--accent-strong);
}
.desc { font-size: 0.92rem; color: var(--muted); }
.go { color: var(--accent); font-size: 1.3rem; transition: transform .15s; }
.tool:hover .go { transform: translateX(3px); }

footer .wrap { padding-block: 0 32px; font-size: 0.85rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .tool, .go { transition: none; }
  .tool:hover, .tool:hover .go { transform: none; }
}
</style>

          </span>
          <span class="text">

          </span>
