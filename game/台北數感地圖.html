<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NUMINA 台北數感地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}

/* Layout: 浮空島式台北地圖＋右側「攝影機加入遊客」面板；窄螢幕上下排列 */
:root{
  --teal:#0aaca3; --teal-d:#097881; --teal-l:#82d3c6; --teal-ll:#c0e9e2; --mint:#ecf8f6;
  --sky:#00b1e0; --sky-d:#0093b8; --sky-l:#6de2f3; --sky-ll:#d9ffff;
  --red:#e83e48; --orange:#ff9600; --blue:#2b70c9; --yellow:#f3e43b; --ink:#0b3b40; --white:#fff;
  --ink-soft:#3f6f72;
  --display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--mint);color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,36px);margin:0;color:var(--teal-d);letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--orange)}
.sub{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.count{display:flex;align-items:center;gap:10px;background:var(--white);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:999px;padding:6px 16px 6px 8px;font-weight:700}
.count b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--teal-d);font-variant-numeric:tabular-nums}
.count .dot{width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-family:"Fredoka",var(--display);font-weight:700;color:var(--ink);border:2px solid var(--ink)}

.game{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}}

.mapbox{position:relative;isolation:isolate;width:100%;aspect-ratio:1000/940;max-width:100%;background:var(--yellow);border-radius:24px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.mapbox svg.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}

.dname{font-family:var(--display);font-size:17px;fill:var(--teal-d);opacity:.7;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.lm{cursor:pointer}
.lm .hit{fill:transparent}
.lm .lbl-bg{fill:var(--white);stroke:var(--ink);stroke-width:2}
.lm .lbl{font-family:var(--body);font-weight:700;font-size:14px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.lm .art{transform-box:fill-box;transform-origin:50% 100%;transition:transform .2s}
.lm:hover .art,.lm:focus-visible .art{transform:scale(1.06)}
.lm:focus{outline:none}
.lm:focus-visible .lbl-bg{stroke:var(--orange);stroke-width:3}
.lm .ring,.lm .star{display:none}
.lm.active .art{animation:hop .6s ease-in-out 3}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.08,1.04)}70%{transform:translateY(0) scale(1.04,.96)}}

/* 地標循環動畫 */
.lit{animation:lit 2.4s ease-in-out infinite}
@keyframes lit{0%,100%{fill:#6de2f3}50%{fill:#f3e43b}}
.beacon{animation:blink 1.2s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.tsway{transform-box:fill-box;transform-origin:50% 100%;animation:tsway 3s ease-in-out infinite alternate}
@keyframes tsway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 2.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.7)}40%{opacity:.95}100%{opacity:0;transform:translateY(-16px) scaleY(1.15)}}
.twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.takeoff{transform-box:fill-box;transform-origin:50% 50%;animation:takeoff 7s ease-in infinite}
@keyframes takeoff{0%{transform:translate(-50px,0);opacity:0}10%{opacity:1}28%{transform:translate(0,0)}62%{transform:translate(120px,-100px) rotate(-16deg);opacity:1}72%{transform:translate(150px,-125px) rotate(-16deg);opacity:0}100%{transform:translate(-50px,0);opacity:0}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag .9s ease-in-out infinite alternate}
@keyframes flag{from{transform:skewY(-8deg) scaleX(.9)}to{transform:skewY(8deg) scaleX(1)}}
.bob{animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-22px)}}
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
.windows{animation:winglow 3s ease-in-out infinite alternate}
@keyframes winglow{from{fill:#f3e43b}to{fill:#fff}}

/* 聲紋遊客 */
.walker{position:absolute;transform:translate(-50%,-96%);cursor:pointer}
.walker .flip{width:100%;height:100%}
.walker.left .flip{transform:scaleX(-1)}
.walker img{display:block;width:100%;height:100%;transform-origin:50% 100%;filter:drop-shadow(0 2px 0 rgba(11,59,64,.3));animation:waddle .32s ease-in-out infinite alternate}
.walker.rest img{animation:look 1.2s ease-in-out infinite alternate}
.walker.cheer img{animation:jump .45s ease-in-out 4}
@keyframes waddle{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-6%)}}
@keyframes look{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-22%)}}
.walker::after{content:"";position:absolute;left:15%;right:15%;bottom:-3%;height:8%;border-radius:50%;background:rgba(11,59,64,.18);z-index:-1}
.walker:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.walker.new{animation:arrive .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes arrive{from{transform:translate(-50%,-260%) scale(.4);opacity:0}}
.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;animation:pop .25s ease-out;z-index:9}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--ink)}
@keyframes pop{from{opacity:0}}

aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--white);border-radius:20px;padding:14px 16px;border:3px solid var(--ink)}
.panel h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 6px;color:var(--teal-d)}
.panel p.hint{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.55}
.steps li::before{counter-increment:st;content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:2px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;background:var(--teal);color:var(--white);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--white);color:var(--ink)}
.btn.warm{background:var(--yellow);color:var(--ink)}
.btn.big{font-size:16px;padding:11px 18px;flex:1 1 auto}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-bottom:10px}
.roster button{all:unset;cursor:pointer;aspect-ratio:4/5;border-radius:12px;background:var(--mint);border:2px solid var(--teal-ll);display:grid;place-items:center;padding:4px;position:relative}
.roster button img{max-width:100%;max-height:100%}
.roster button .demo{position:absolute;top:-6px;right:-6px;font-size:10px;background:var(--ink);color:#fff;border-radius:999px;padding:0 6px}
.roster button:focus-visible{outline:3px solid var(--orange)}
.empty{font-size:13px;color:var(--ink-soft);background:var(--mint);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.cast{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:4px}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.2}
.cast canvas{width:100%;height:auto;aspect-ratio:300/370}
.foot{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.6}

/* 卡片 */
.sheet{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(470px,calc(100% - 32px));background:var(--white);border-radius:22px;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink),0 20px 50px rgba(11,59,64,.25);padding:16px 18px 18px;z-index:40;animation:sheetin .3s cubic-bezier(.3,1.4,.5,1);max-height:calc(100% - 40px);overflow:auto}
@keyframes sheetin{from{transform:translate(-50%,30px);opacity:0}}
.sheet .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--white);background:var(--teal-d);border-radius:999px;padding:2px 10px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:4px 0 0;color:var(--ink)}
.sheet .say{background:var(--mint);border-radius:14px;padding:8px 12px;margin:12px 0 0;font-weight:700;color:var(--teal-d);font-size:14px}
.sheet .fact{margin:10px 0 0;line-height:1.7;font-size:15px}
.sheet .num{font-family:var(--display);color:var(--orange);font-size:1.15em}
.sheet .formula{font-family:"Fredoka",var(--body);font-size:14px;background:var(--ink);color:var(--sky-ll);border-radius:12px;padding:8px 12px;overflow-x:auto;white-space:nowrap;margin-top:10px}
.sheet .formula em{color:var(--yellow);font-style:normal;font-weight:600}
.sheet .big{display:flex;gap:14px;align-items:center}
.sheet .big .pic{width:120px;height:150px;flex:none;background:linear-gradient(180deg,#f4feff,#d9ffff);border-radius:16px;border:2px solid var(--ink);display:grid;place-items:center;padding:8px}
.sheet .big .pic img{max-width:100%;max-height:100%}
.quiz{margin-top:12px;border-top:2px dashed var(--teal-ll);padding-top:12px}
.quiz .q{font-weight:700;margin:0 0 10px;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--teal-ll);background:var(--white);border-radius:14px;padding:10px;font-weight:700;font-size:15px;color:var(--ink)}
.opt:hover{border-color:var(--teal)}
.opt.right{background:var(--teal);border-color:var(--teal);color:var(--white)}
.opt.wrong{background:#fff0f0;border-color:var(--red);color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.result{margin:10px 0 0;font-weight:700;line-height:1.6}
.result.ok{color:var(--teal-d)}.result.no{color:var(--red)}
.close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--mint);color:var(--teal-d);font-size:20px;line-height:1}
.sheet .btnrow{margin-top:12px}

/* 攝影機視窗 */
.modal{position:fixed;inset:0;z-index:80;background:rgba(11,59,64,.55);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dialog{position:relative;width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--white);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px}
.dialog h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;color:var(--teal-d)}
.camwrap{position:relative;width:100%;aspect-ratio:4/3;background:var(--ink);border-radius:16px;overflow:hidden}
.camwrap video,.camwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.camwrap video{object-fit:fill}
.camwrap .guide{position:absolute;inset:8% 14%;border:3px dashed rgba(255,255,255,.8);border-radius:14px;pointer-events:none}
.camwrap .nocam{position:absolute;inset:0;display:grid;place-items:center;color:var(--white);text-align:center;padding:20px;font-size:14px;line-height:1.7}
.camstatus{margin:0;font-weight:700;font-size:14px;min-height:1.5em;color:var(--teal-d)}
.camstatus.warn{color:var(--red)}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.auto input{accent-color:var(--teal);width:18px;height:18px}
.res{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.res{grid-template-columns:1fr}}
.res .pic{background:repeating-conic-gradient(var(--mint) 0 25%,#fff 0 50%) 0 0/18px 18px;border:2px solid var(--ink);border-radius:16px;aspect-ratio:4/5;display:grid;place-items:center;padding:10px}
.res .pic canvas{max-width:100%;max-height:100%}
.res h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.res .conf{font-size:13px;color:var(--ink-soft);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:#fff;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;margin-bottom:12px}
.field input{font:inherit;font-weight:500;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;color:var(--ink);background:#fff}
.field input:focus-visible{outline:3px solid var(--orange);outline-offset:1px}
.toast{position:fixed;top:max(16px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:999px;font-weight:700;z-index:90;animation:pop .3s;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>NUMINA <span>台北</span>數感地圖</h1>
      <p class="sub">把印出來的聲紋角色拿到攝影機前，它就會跳進地圖，在台北街頭散步。</p>
    </div>
    <div class="count" aria-live="polite"><span class="dot">π</span>遊客 <b id="countN">0</b> / 12</div>
  </header>

  <div class="game">
    <div class="mapbox" id="mapbox">
      <svg class="map" id="map" viewBox="0 0 1000 940" role="img" aria-label="台北市十二行政區插畫地圖"></svg>
      <div class="overlay" id="overlay"></div>
    </div>

    <aside>
      <section class="panel">
        <h2>攝影機加入遊客</h2>
        <ol class="steps">
          <li>在「聲紋試衣間」選角色、唱出花紋，按「下載圖片」後印出來。</li>
          <li>把紙放在桌上，讓白紙填滿攝影機畫面，角色放在虛線框中間。</li>
          <li>畫面認出角色後會自動拍照，確認角色和名字就能加入地圖。</li>
        </ol>
        <div class="btnrow">
          <button class="btn big" id="camBtn">開啟攝影機</button>
          <button class="btn ghost" id="upBtn">上傳照片</button>
          <input type="file" id="upFile" accept="image/*" hidden>
        </div>
        <div class="cast" id="cast" aria-label="可以辨識的七位角色"></div>
      </section>
      <section class="panel">
        <h2>地圖上的遊客</h2>
        <p class="hint">點遊客可以看他的聲紋衣，也可以請他回家。</p>
        <div class="roster" id="roster"></div>
        <p class="empty" id="rosterEmpty" hidden>地圖上還沒有遊客，用攝影機加入第一位吧！</p>
        <div class="btnrow"><button class="btn ghost" id="clearBtn">清除全部遊客</button></div>
      </section>
      <p class="foot">點地圖上的地標可以看數學小知識。地圖為插畫示意，行政區形狀經過簡化。</p>
    </aside>
  </div>
</div>

<div class="modal" id="camModal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="camTitle">
    <button class="close" id="camClose" aria-label="關閉">×</button>
    <h2 id="camTitle">把聲紋角色拿到攝影機前</h2>
    <div id="camView">
      <div class="camwrap" id="camwrap">
        <video id="video" playsinline muted></video>
        <canvas id="camOverlay"></canvas>
        <div class="guide"></div>
        <div class="nocam" id="nocam" hidden></div>
      </div>
    </div>
    <p class="camstatus" id="camStatus">正在開啟攝影機…</p>
    <div class="btnrow" id="camBtns">
      <button class="btn" id="snapBtn">拍照偵測</button>
      <button class="btn ghost" id="camUpBtn">改用上傳照片</button>
      <label class="auto"><input type="checkbox" id="autoSnap" checked> 認出角色就自動拍照</label>
    </div>
    <div class="res" id="resView" hidden>
      <div class="pic"><canvas id="resCanvas"></canvas></div>
      <div>
        <h3 id="resTitle">偵測結果</h3>
        <p class="conf" id="resConf"></p>
        <div class="chips" id="resChips" role="group" aria-label="選擇角色"></div>
        <label class="field" for="resName">遊客名字<input id="resName" maxlength="8" autocomplete="off"></label>
        <div class="btnrow">
          <button class="btn warm" id="joinBtn">加入地圖</button>
          <button class="btn ghost" id="retryBtn">重拍</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(async function(){
const SVGNS="http://www.w3.org/2000/svg", VW=1000, VH=940;
const C={teal:"#0aaca3",tealD:"#097881",tealL:"#82d3c6",tealLL:"#c0e9e2",mint:"#ecf8f6",sky:"#00b1e0",skyD:"#0093b8",skyL:"#6de2f3",skyLL:"#d9ffff",red:"#e83e48",redD:"#b52a33",orange:"#ff9600",orangeD:"#c46f00",blue:"#2b70c9",blueD:"#1d4f91",yellow:"#f3e43b",yellowD:"#c9bb20",ink:"#0b3b40",white:"#fff",shade:"#d6ecea"};
const $=id=>document.getElementById(id);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pick=a=>a[Math.floor(rnd()*a.length)];

/* ================= 地理（示意） ================= */
const P={A:[150,300],B:[170,200],C:[250,110],D:[350,60],E:[450,40],F:[540,70],G:[610,130],H:[660,230],I:[760,250],J:[850,300],K:[900,390],L:[920,480],M:[880,560],N:[800,600],O:[820,680],Pp:[790,780],Q:[700,850],R:[590,860],S:[520,800],T:[480,730],U:[420,700],V:[350,700],W:[300,640],X:[290,560],p25:[290,520],Y:[280,470],Z:[250,400],p3:[240,350],p1:[420,170],p2:[340,280],p4:[620,330],p5:[520,360],p6:[400,370],p7:[800,420],p8:[690,420],p9:[600,420],p10:[560,470],p11:[420,470],p12:[700,480],p13:[610,490],p14:[730,520],p16:[640,590],p17:[490,470],p18:[610,680],p19:[500,690],p21:[720,670],p24:[400,510],p26:[420,620]};
const OUTER="A B C D E F G H I J K L M N O Pp Q R S T U V W X p25 Y Z p3".split(" ");
const DIST=[

const PI=Math.PI,S3=Math.sqrt(3)/2;
function sqList(){const L=[];for(let n=1;n<=7;n++)for(let m=n+1;m<=8;m++)L.push([n,m]);return L.sort((a,b)=>(a[0]**2+a[1]**2)-(b[0]**2+b[1]**2)||a[0]-b[0])}
const FAMS=[
 {name:'方板・反相',amp:2,list:sqList(),f:(x,y,[n,m])=>Math.cos(n*PI*x)*Math.cos(m*PI*y)-Math.cos(m*PI*x)*Math.cos(n*PI*y),label:([n,m])=>`n${n}·m${m}`,tex:([n,m])=>`cos(<em>${n}</em>πx)·cos(<em>${m}</em>πy) − cos(<em>${m}</em>πx)·cos(<em>${n}</em>πy) = 0`},
 {name:'方板・同相',amp:2,list:sqList(),f:(x,y,[n,m])=>Math.cos(n*PI*x)*Math.cos(m*PI*y)+Math.cos(m*PI*x)*Math.cos(n*PI*y),label:([n,m])=>`n${n}·m${m}`,tex:([n,m])=>`cos(<em>${n}</em>πx)·cos(<em>${m}</em>πy) + cos(<em>${m}</em>πx)·cos(<em>${n}</em>πy) = 0`},
 {name:'圓板',amp:1,list:(()=>{const L=[];for(let k=1;k<=5;k++)for(let n=0;n<=7;n++)L.push([n,k]);return L.sort((a,b)=>(a[1]+a[0]*.45)-(b[1]+b[0]*.45))})(),f:(x,y,[n,k])=>Math.cos(k*PI*Math.sqrt(x*x+y*y))*Math.cos(n*Math.atan2(x,y)),label:([n,k])=>`n${n}·k${k}`,tex:([n,k])=>`cos(<em>${k}</em>π·r) · cos(<em>${n}</em>θ) = 0`},
 {name:'六角板',amp:3,list:Array.from({length:22},(_,i)=>+(1.2+i*.35).toFixed(2)),f:(x,y,q)=>{const k=q*PI;return Math.cos(k*y)+Math.cos(k*(S3*x-.5*y))+Math.cos(k*(-S3*x-.5*y))},label:q=>`q ${q}`,tex:q=>`cos(<em>${q}</em>π·u₁) + cos(<em>${q}</em>π·u₂) + cos(<em>${q}</em>π·u₃) = 0`},
 {name:'雙波源',amp:2,list:Array.from({length:24},(_,i)=>+(2+i*.5).toFixed(1)),f:(x,y,k)=>Math.cos(k*PI*Math.hypot(x-.5,y+.2))+Math.cos(k*PI*Math.hypot(x+.5,y+.2)),label:k=>`k ${k}`,tex:k=>`cos(<em>${k}</em>π·d₁) + cos(<em>${k}</em>π·d₂) = 0`}

function makeSim(N){const s={N,fi:0,p:[1,2],px:new Float32Array(N),py:new Float32Array(N),sg:new Uint8Array(N)};for(let i=0;i<N;i++){s.px[i]=Math.random()*2-1;s.py[i]=Math.random()*2-1}return s}
function stepSim(s,ag){const F=FAMS[s.fi],fn=F.f,p=s.p,inv=1/F.amp,px=s.px,py=s.py,sg=s.sg;
  for(let i=0;i<s.N;i++){let x=px[i],y=py[i];const f=fn(x,y,p)*inv;sg[i]=f>0?1:0;const st=ag*(.003+.15*Math.abs(f));

  const B=comps[best],sel=new Uint8Array(comps.length);sel[best]=1;let X0=B.x0,Y0=B.y0,X1=B.x1,Y1=B.y1;
  comps.forEach((c,i)=>{if(i===best||c.edge||c.n<3)return;const cx=(c.x0+c.x1)/2,cy=(c.y0+c.y1)/2;if(cx>=B.x0&&cx<=B.x1&&cy>=B.y0&&cy<=B.y1){sel[i]=1;X0=Math.min(X0,c.x0);Y0=Math.min(Y0,c.y0);X1=Math.max(X1,c.x1);Y1=Math.max(Y1,c.y1);}});
  const box={x0:X0/w,y0:Y0/h,x1:(X1+1)/w,y1:(Y1+1)/h};
  if(quick)return {box};
  if((Y1-Y0)<h*.12)return {err:'small',box};
  const pad=2,bx0=Math.max(0,X0-pad),by0=Math.max(0,Y0-pad),bx1=Math.min(w-1,X1+pad),by1=Math.min(h-1,Y1+pad),bw=bx1-bx0+1,bh=by1-by0+1;
  const inSel=p=>lab[p]>=0&&sel[lab[p]]===1,vis=new Uint8Array(bw*bh),qq=new Int32Array(bw*bh);let qh=0,qt=0;
  const push=(xx,yy)=>{const k=yy*bw+xx;if(vis[k])return;if(inSel((by0+yy)*w+bx0+xx))return;vis[k]=1;qq[qt++]=k;};
  for(let xx=0;xx<bw;xx++){push(xx,0);push(xx,bh-1);}for(let yy=0;yy<bh;yy++){push(0,yy);push(bw-1,yy);}
  while(qh<qt){const k=qq[qh++],xx=k%bw,yy=(k/bw)|0;if(xx>0)push(xx-1,yy);if(xx<bw-1)push(xx+1,yy);if(yy>0)push(xx,yy-1);if(yy<bh-1)push(xx,yy+1);}
  const cut=mk(bw,bh),cx=cut.getContext('2d'),out=cx.createImageData(bw,bh);
  for(let yy=0;yy<bh;yy++)for(let xx=0;xx<bw;xx++){const k=yy*bw+xx,p=(by0+yy)*w+bx0+xx,o=k*4;out.data[o]=d[p*4];out.data[o+1]=d[p*4+1];out.data[o+2]=d[p*4+2];out.data[o+3]=vis[k]?0:255;}
  cx.putImageData(out,0,0);
  const sm=mk(bw,bh),sx=sm.getContext('2d');sx.filter='blur(.6px)';sx.drawImage(cut,0,0);sx.filter='none';sx.globalCompositeOperation='source-atop';sx.drawImage(cut,0,0);
  return {cut:cropAlpha(sm)||cut,box};
}

const GW=36,GH=44;let TPL=null;
function toGrid(cv){const g=mk(GW,GH),x=g.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';x.drawImage(cv,0,0,GW,GH);return x.getImageData(0,0,GW,GH).data;}
function buildTemplates(){TPL={};for(const id of ORDER){const cv=mk(W/2,H/2),x=cv.getContext('2d');x.scale(.5,.5);drawChar(x,id,null,null,0,0,{key:true});
  const c=cropAlpha(cv),d=toGrid(c),n=GW*GH,m=new Uint8Array(n),gm=new Uint8Array(n),rgb=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];m[i]=d[i*4+3]>128?1:0;gm[i]=(r>150&&b>150&&g<120)?1:0;rgb[i*3]=r;rgb[i*3+1]=g;rgb[i*3+2]=b;}
  TPL[id]={m,gm,rgb,ar:c.width/c.height};}}
function classify(cut){if(!TPL)buildTemplates();const d=toGrid(cut),n=GW*GH,ar=cut.width/cut.height;
  return ORDER.map(id=>{const t=TPL[id];let inter=0,uni=0,cs=0,cn=0;
    for(let i=0;i<n;i++){const cm=d[i*4+3]>128,tm=t.m[i];if(cm&&tm)inter++;if(cm||tm)uni++;
      if(cm&&tm&&!t.gm[i]){const dr=d[i*4]-t.rgb[i*3],dg=d[i*4+1]-t.rgb[i*3+1],db=d[i*4+2]-t.rgb[i*3+2];cs+=Math.exp(-Math.sqrt(dr*dr+dg*dg+db*db)/70);cn++;}}
    const iou=uni?inter/uni:0,col=cn>20?cs/cn:0,asp=Math.exp(-Math.abs(Math.log(ar/t.ar))*3);
    return {id,score:.35*iou+.25*asp+.4*col};}).sort((a,b)=>b.score-a.score);}
