<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NUMINA 台北數感地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}

/* Layout: 浮空島式台北地圖（黃底、地層切面），右側角色托盤＋集章護照；窄螢幕上下排列 */
:root{
  --teal:#0aaca3; --teal-d:#097881; --teal-l:#82d3c6; --teal-ll:#c0e9e2; --mint:#ecf8f6;
  --sky:#00b1e0; --sky-d:#0093b8; --sky-l:#6de2f3; --sky-ll:#d9ffff;
  --red:#e83e48; --orange:#ff9600; --blue:#2b70c9; --yellow:#f3e43b; --ink:#0b3b40; --white:#fff;
  --ink-soft:#3f6f72;
  --display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{background:var(--mint);color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,36px);margin:0;color:var(--teal-d);letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--orange)}
.sub{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.score{display:flex;align-items:center;gap:10px;background:var(--white);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:999px;padding:6px 16px 6px 8px;font-weight:700}
.score b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--teal-d);font-variant-numeric:tabular-nums}
.score .dot{width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-family:var(--display);color:var(--ink);border:2px solid var(--ink)}

.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}}

.mapbox{position:relative;isolation:isolate;width:100%;aspect-ratio:1000/940;max-width:100%;background:var(--yellow);border-radius:24px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.mapbox svg.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}

.dname{font-family:var(--display);font-size:17px;fill:var(--teal-d);opacity:.7;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.lm{cursor:pointer}
.lm .hit{fill:transparent}
.lm .lbl-bg{fill:var(--white);stroke:var(--ink);stroke-width:2}
.lm .lbl{font-family:var(--body);font-weight:700;font-size:14px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.lm .art{transform-box:fill-box;transform-origin:50% 100%;transition:transform .2s}
.lm:hover .art,.lm:focus-visible .art{transform:scale(1.06)}
.lm:focus{outline:none}
.lm:focus-visible .lbl-bg{stroke:var(--orange);stroke-width:3}
.lm.near .art{transform:scale(1.12)}
.lm.near .ring{opacity:1}
.lm .ring{fill:none;stroke:var(--red);stroke-width:4;stroke-dasharray:8 8;opacity:0;transition:opacity .15s}
.lm .star{opacity:0;transition:opacity .3s}
.lm.done .star{opacity:1}
.lm.active .art{animation:hop .6s ease-in-out 3}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.08,1.04)}70%{transform:translateY(0) scale(1.04,.96)}}

/* 地標循環動畫 */
.lit{animation:lit 2.4s ease-in-out infinite}
@keyframes lit{0%,100%{fill:#6de2f3}50%{fill:#f3e43b}}
.beacon{animation:blink 1.2s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.tsway{transform-box:fill-box;transform-origin:50% 100%;animation:tsway 3s ease-in-out infinite alternate}
@keyframes tsway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 2.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.7)}40%{opacity:.95}100%{opacity:0;transform:translateY(-16px) scaleY(1.15)}}
.twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.takeoff{transform-box:fill-box;transform-origin:50% 50%;animation:takeoff 7s ease-in infinite}
@keyframes takeoff{0%{transform:translate(-50px,0);opacity:0}10%{opacity:1}28%{transform:translate(0,0)}62%{transform:translate(120px,-100px) rotate(-16deg);opacity:1}72%{transform:translate(150px,-125px) rotate(-16deg);opacity:0}100%{transform:translate(-50px,0);opacity:0}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag .9s ease-in-out infinite alternate}
@keyframes flag{from{transform:skewY(-8deg) scaleX(.9)}to{transform:skewY(8deg) scaleX(1)}}
.bob{animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-22px)}}
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
.windows{animation:winglow 3s ease-in-out infinite alternate}
@keyframes winglow{from{fill:#f3e43b}to{fill:#fff}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 遊客（聲紋試衣間人物） */
.walker{position:absolute;width:5.4%;aspect-ratio:180/222;transform:translate(-50%,-96%);cursor:pointer;background-repeat:no-repeat;background-size:400% 100%;background-position:0 0;filter:drop-shadow(0 2px 0 rgba(11,59,64,.25))}
.walker.walk{animation:walkcyc .5s steps(4) infinite}
@keyframes walkcyc{from{background-position:0 0}to{background-position:133.333% 0}}
.walker.flip{transform:translate(-50%,-96%) scaleX(-1)}
.walker.flip .bubble{transform:translate(-50%,-6px) scaleX(-1)}
.walker:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}

/* NUMINA 角色 */
.chr{position:absolute;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transform:translate(-50%,-100%);filter:drop-shadow(0 4px 0 rgba(11,59,64,.3));z-index:5}
.chr svg{display:block;width:100%;height:auto}
.chr.drag{cursor:grabbing;position:fixed;z-index:50;transform:translate(-50%,-80%) scale(1.12)}
.chr.placed{animation:land .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:translate(-50%,-140%) scale(.9)}100%{transform:translate(-50%,-100%) scale(1)}}
.chr:focus-visible{outline:3px solid var(--orange);outline-offset:4px;border-radius:12px}
.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;animation:pop .25s ease-out;z-index:9}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--ink)}
@keyframes pop{from{opacity:0}}

aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--white);border-radius:20px;padding:14px 16px;border:3px solid var(--ink)}
.panel h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 4px;color:var(--teal-d)}
.panel p.hint{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.tray{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-around;gap:10px 6px;min-height:110px;background:var(--mint);border-radius:14px;padding:10px 6px 12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px}
.slot .holder{position:relative;height:84px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.slot .holder .chr{position:relative;transform:none;left:auto;top:auto}
.slot .holder .chr.placed{animation:none}
.slot .nm{font-family:var(--display);font-size:13px;color:var(--ink)}
.slot.out .nm{color:var(--teal-l)}
.slot.out .nm::after{content:" ・出遊中"}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;background:var(--teal);color:var(--white);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--white);color:var(--ink)}
.btn.warm{background:var(--yellow);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.vis{display:flex;flex-wrap:wrap;gap:6px}
.vis button{all:unset;cursor:pointer;width:38px;height:46px;border-radius:10px;background:var(--mint);border:2px solid var(--teal-ll);display:grid;place-items:center}
.vis button:focus-visible{outline:3px solid var(--orange)}
.vis canvas{width:30px;height:37px}

.passport{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--teal-ll);display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.2;color:var(--teal-l);padding:4px;cursor:pointer;background:none}
.stamp.got{border:3px solid var(--red);color:var(--red);font-weight:900;transform:rotate(-8deg);background:#fff5f5}
.stamp.got.new{animation:stampin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampin{0%{transform:scale(2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}

.sheet{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 32px));background:var(--white);border-radius:22px;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink),0 20px 50px rgba(11,59,64,.25);padding:16px 18px 18px;z-index:40;animation:sheetin .3s cubic-bezier(.3,1.4,.5,1);max-height:calc(100% - 40px);overflow:auto}
@keyframes sheetin{from{transform:translate(-50%,30px);opacity:0}}
.sheet .top{display:flex;gap:12px;align-items:center}
.sheet .face{width:56px;flex:none}
.sheet .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--white);background:var(--teal-d);border-radius:999px;padding:2px 10px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:4px 0 0;color:var(--ink)}
.sheet .say{background:var(--mint);border-radius:14px;padding:8px 12px;margin:12px 0 0;font-weight:700;color:var(--teal-d);font-size:14px}
.sheet .fact{margin:10px 0 0;line-height:1.7;font-size:15px}
.sheet .num{font-family:var(--display);color:var(--orange);font-size:1.15em}
.sheet .formula{font-family:"Fredoka",var(--body);font-size:14px;background:var(--ink);color:var(--sky-ll);border-radius:12px;padding:8px 12px;overflow-x:auto;white-space:nowrap;margin-top:10px}
.sheet .formula em{color:var(--yellow);font-style:normal;font-weight:600}
.sheet .big{display:flex;gap:14px;align-items:center}
.sheet .big canvas{width:130px;height:160px;flex:none;background:linear-gradient(180deg,#f4feff,#d9ffff);border-radius:16px;border:2px solid var(--ink)}
.quiz{margin-top:12px;border-top:2px dashed var(--teal-ll);padding-top:12px}
.quiz .q{font-weight:700;margin:0 0 10px;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--teal-ll);background:var(--white);border-radius:14px;padding:10px;font-weight:700;font-size:15px;color:var(--ink)}
.opt:hover{border-color:var(--teal)}
.opt.right{background:var(--teal);border-color:var(--teal);color:var(--white)}
.opt.wrong{background:#fff0f0;border-color:var(--red);color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.result{margin:10px 0 0;font-weight:700;line-height:1.6}
.result.ok{color:var(--teal-d)}.result.no{color:var(--red)}
.close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--mint);color:var(--teal-d);font-size:20px;line-height:1}
.toast{position:fixed;top:max(16px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;animation:pop .3s}
.confetti{position:fixed;width:10px;height:14px;z-index:70;pointer-events:none;border-radius:3px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.8}}
.foot{font-size:12px;color:var(--ink-soft);margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>NUMINA <span>台北</span>數感地圖</h1>
      <p class="sub">地標會動、遊客會逛街。把數感角色拖到地標上，答對數學題就能蓋章！</p>
    </div>
    <div class="score" aria-live="polite"><span class="dot">章</span>集章 <b id="scoreN">0</b> / 12</div>
  </header>

  <div class="game">
    <div class="mapbox" id="mapbox">
      <svg class="map" id="map" viewBox="0 0 1000 940" role="img" aria-label="台北市十二行政區插畫地圖"></svg>
      <div class="overlay" id="overlay"></div>
    </div>

    <aside>
      <section class="panel">
        <h2>數感小隊</h2>
        <p class="hint">按住角色拖到地圖上的地標，放開就會開始探索。拖回這裡可以讓角色休息。</p>
        <div class="tray" id="tray"></div>
        <div class="btnrow">
          <button class="btn" id="tourBtn">隨機出發</button>
          <button class="btn ghost" id="homeBtn">全員回家</button>
        </div>
      </section>
      <section class="panel">
        <h2>聲紋遊客</h2>
        <p class="hint">穿著聲紋衣的遊客正在台北散步，點一下遊客就能看他衣服上的克拉尼圖形。</p>
        <div class="vis" id="visList"></div>
        <div class="btnrow"><button class="btn warm" id="addWalker">再來一位遊客</button></div>
      </section>
      <section class="panel">
        <h2>台北數感護照</h2>
        <p class="hint">每個地標答對一題就能蓋一個章。點章可以重新查看地標。</p>
        <div class="passport" id="passport"></div>
        <div class="btnrow"><button class="btn ghost" id="resetBtn">清空護照</button></div>
      </section>
      <p class="foot">地圖為插畫示意，行政區形狀與位置經過簡化。</p>
    </aside>
  </div>
</div>

<script>
(async function(){
const SVGNS="http://www.w3.org/2000/svg", VW=1000, VH=940;
const C={teal:"#0aaca3",tealD:"#097881",tealL:"#82d3c6",tealLL:"#c0e9e2",mint:"#ecf8f6",sky:"#00b1e0",skyD:"#0093b8",skyL:"#6de2f3",skyLL:"#d9ffff",red:"#e83e48",redD:"#b52a33",orange:"#ff9600",orangeD:"#c46f00",blue:"#2b70c9",blueD:"#1d4f91",yellow:"#f3e43b",yellowD:"#c9bb20",ink:"#0b3b40",white:"#fff",shade:"#d6ecea"};
const $=id=>document.getElementById(id);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pick=a=>a[Math.floor(rnd()*a.length)];

/* ================= 地理（示意） ================= */
const P={A:[150,300],B:[170,200],C:[250,110],D:[350,60],E:[450,40],F:[540,70],G:[610,130],H:[660,230],I:[760,250],J:[850,300],K:[900,390],L:[920,480],M:[880,560],N:[800,600],O:[820,680],Pp:[790,780],Q:[700,850],R:[590,860],S:[520,800],T:[480,730],U:[420,700],V:[350,700],W:[300,640],X:[290,560],p25:[290,520],Y:[280,470],Z:[250,400],p3:[240,350],p1:[420,170],p2:[340,280],p4:[620,330],p5:[520,360],p6:[400,370],p7:[800,420],p8:[690,420],p9:[600,420],p10:[560,470],p11:[420,470],p12:[700,480],p13:[610,490],p14:[730,520],p16:[640,590],p17:[490,470],p18:[610,680],p19:[500,690],p21:[720,670],p24:[400,510],p26:[420,620]};
const OUTER="A B C D E F G H I J K L M N O Pp Q R S T U V W X p25 Y Z p3".split(" ");
const DIST=[
 {n:"北投區",k:"A B C D E p1 p2 p3",hill:1},
 {n:"士林區",k:"E F G H p4 p5 p6 Z p3 p2 p1",hill:1},
 {n:"內湖區",k:"H I J K p7 p8 p4",hill:1},
 {n:"中山區",k:"p6 p5 p4 p9 p10 p17 p11"},
 {n:"松山區",k:"p4 p8 p12 p13 p10 p9"},
 {n:"南港區",k:"K L M N p14 p12 p8 p7",hill:1},
 {n:"信義區",k:"p13 p12 p14 N p21 p18 p16"},
 {n:"大安區",k:"p17 p10 p13 p16 p18 p19"},
 {n:"大同區",k:"Z p6 p11 p24 p25 Y"},
 {n:"萬華區",k:"p25 p24 p26 U V W X"},
 {n:"中正區",k:"p11 p17 p19 T U p26 p24"},
 {n:"文山區",k:"p19 p18 p21 N O Pp Q R S T",hill:1}
].map(d=>({...d,pts:d.k.split(" ").map(k=>P[k])}));
const LBL={"北投區":[200,330],"士林區":[600,270],"內湖區":[880,350],"中山區":[590,385],"松山區":[705,425],"南港區":[870,530],"信義區":[785,650],"大安區":[600,660],"大同區":[385,500],"萬華區":[290,670],"中正區":[455,690],"文山區":[540,780]};
const outerPts=OUTER.map(k=>P[k]);
const ptsStr=a=>a.map(p=>p.join(",")).join(" ");
function inPoly(x,y,pts){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function distSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy);}
function distLine(x,y,line){let m=1e9;for(let i=0;i<line.length-1;i++)m=Math.min(m,distSeg(x,y,line[i],line[i+1]));return m;}
const smooth=pts=>{let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length-1;i++){const m=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];d+=` Q${pts[i][0]} ${pts[i][1]} ${m[0]} ${m[1]}`;}const l=pts[pts.length-1];return d+` L${l[0]} ${l[1]}`;};

/* 捷運與步道 */
const MRT=[
 {name:"淡水信義線",col:C.red,pts:[[290,240],[360,292],[430,330],[452,395],[440,470],[432,520],[452,590],[540,612],[620,610],[690,600]]},
 {name:"板南線",col:C.blue,pts:[[300,590],[345,565],[390,535],[432,520],[530,522],[600,530],[680,540],[760,520],[800,500],[835,478]]},
 {name:"文湖線",col:C.orange,pts:[[640,800],[620,720],[598,660],[566,622],[560,540],[575,490],[620,452],[662,432],[700,398],[760,382],[815,410],[835,478]]}
];
const TRAILS=[[[262,410],[282,480],[298,560],[318,640],[362,690]],[[240,250],[330,300],[430,262],[520,262],[600,300],[650,290]],[[700,640],[760,700],[740,780],[660,820]]];

  for(const side of[0,1]){ctx.fillStyle=col[2+side];ctx.beginPath();for(let i=0;i<sim.N;i++)if(sim.sg[i]===side)ctx.rect(cx+sim.px[i]*half-psz/2,cy+sim.py[i]*half-psz/2,psz,psz);ctx.fill()}
  ctx.restore();ctx.strokeStyle=INK;ctx.lineWidth=6;ctx.stroke(gp);
  ctx.beginPath();ctx.ellipse(300,192,108,100,0,0,Math.PI*2);ctx.fillStyle=SKIN;ctx.fill();ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(190,206);ctx.bezierCurveTo(176,46,424,46,410,206);ctx.quadraticCurveTo(358,196,303,124);ctx.lineTo(297,124);ctx.quadraticCurveTo(242,196,190,206);ctx.closePath();ctx.fillStyle=HAIR;ctx.fill();ctx.stroke();
  ctx.save();ctx.translate(g==='girl'?370:232,g==='girl'?122:120);ctx.rotate(g==='girl'?.35:-.35);ctx.font='700 46px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=7;ctx.strokeStyle=INK;ctx.strokeText('π',0,0);ctx.fillStyle='#f3e43b';ctx.fillText('π',0,0);ctx.restore();
  for(const x of[262,338]){ctx.beginPath();ctx.ellipse(x,214,13,18,0,0,Math.PI*2);ctx.fillStyle=INK;ctx.fill();ctx.beginPath();ctx.arc(x+4,207,4.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}
  ctx.fillStyle=CHEEK;for(const x of[232,368]){ctx.beginPath();ctx.ellipse(x,240,15,9,0,0,Math.PI*2);ctx.fill()}
  ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.beginPath();ctx.arc(300,240,14,.15*Math.PI,.85*Math.PI);ctx.stroke();
}

/* ================= NUMINA 小隊 ================= */
const CHARS=[
 {id:"numina",name:"NUMINA",color:C.teal,dark:C.tealD,sym:"π",vw:100,vh:120,mapW:6,trayH:84,hi:["這裡藏著好多數字！","我來算算看～","π 感應啟動！"]},
 {id:"numi",name:"NUMI",color:C.sky,dark:C.skyD,sym:"+",vw:100,vh:120,mapW:3.2,trayH:40,hi:["我也要看！","哇～好高！","加加加！"]},
 {id:"numnum",name:"NUMNUM",color:C.orange,dark:C.orangeD,sym:"×",vw:300,vh:120,mapW:11,trayH:52,hi:["肚子好餓，先吃再算！","乘起來一定很大！","我來了～咚咚咚"]},
 {id:"anu",name:"ANU",color:C.red,dark:C.redD,sym:"−",vw:100,vh:120,mapW:4.6,trayH:66,hi:["減掉多餘的，答案就出來了","我來找線索！","出發探險！"]},
 {id:"ana",name:"ANA",color:C.yellow,dark:C.yellowD,sym:"÷",vw:100,vh:120,mapW:4.6,trayH:66,hi:["平分給大家！","這裡好漂亮～","我發現一個規律！"]}
];
function charSVG(c,face){const w=c.vw,h=c.vh,ex1=w*0.36,ex2=w*0.64,ey=h*0.56,er=Math.min(13,w*0.13);
  const mouth=face==="wow"?`<ellipse cx="${w/2}" cy="${h*0.76}" rx="6" ry="7" fill="${C.ink}"/>`:`<path d="M${w/2-9} ${h*0.73} Q${w/2} ${h*0.83} ${w/2+9} ${h*0.73}" stroke="${C.ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect x="5" y="30" width="${w-10}" height="${h-34}" rx="${Math.min(40,(h-34)/2)}" fill="${c.color}" stroke="${C.ink}" stroke-width="4"/><text x="${w/2}" y="40" text-anchor="middle" font-family="Fredoka,Huninn,sans-serif" font-size="44" font-weight="700" fill="${c.dark}" stroke="${C.ink}" stroke-width="2" paint-order="stroke">${c.sym}</text><circle cx="${ex1}" cy="${ey}" r="${er}" fill="#fff"/><circle cx="${ex2}" cy="${ey}" r="${er}" fill="#fff"/><circle cx="${ex1+2}" cy="${ey+1}" r="${er*0.5}" fill="${C.ink}"/><circle cx="${ex2+2}" cy="${ey+1}" r="${er*0.5}" fill="${C.ink}"/>${mouth}<ellipse cx="${w*0.24}" cy="${h*0.72}" rx="6" ry="3.5" fill="#fff" opacity=".45"/><ellipse cx="${w*0.76}" cy="${h*0.72}" rx="6" ry="3.5" fill="#fff" opacity=".45"/></svg>`;}

let state={stamps:{},pos:{}};
try{const v=localStorage.getItem("numina-taipei-v2");if(v)state=Object.assign(state,JSON.parse(v));}catch(e){}
if(window.claude?.hot?.data?.state)state=window.claude.hot.data.state;
window.claude?.hot?.snapshot?.(()=>({state}));
function save(){try{localStorage.setItem("numina-taipei-v2",JSON.stringify(state));}catch(e){}}

const tray=$("tray"),overlay=$("overlay"),mapbox=$("mapbox");
const slots={};
CHARS.forEach(c=>{const slot=document.createElement("div");slot.className="slot";slot.innerHTML=`<div class="holder"></div><div class="nm">${c.name}</div>`;tray.appendChild(slot);slots[c.id]=slot;
  const el=document.createElement("div");el.className="chr";el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label",`${c.name}，拖曳到地標`);el.innerHTML=charSVG(c);c.el=el;
  el.addEventListener("pointerdown",e=>startDrag(e,c));
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();const free=LM.filter(l=>!state.stamps[l.id]);const l=pick(free.length?free:LM);placeAt(c,l.x,l.y-30);}});
  if(state.pos[c.id])putOnMap(c,state.pos[c.id].x,state.pos[c.id].y);else toTray(c);});
function sizeInTray(c){c.el.style.width="";c.el.style.height=c.trayH+"px";const v=c.el.querySelector("svg");v.style.height="100%";v.style.width="auto";}
function sizeOnMap(c){c.el.style.height="";c.el.style.width=c.mapW+"%";const v=c.el.querySelector("svg");v.style.height="auto";v.style.width="100%";}
function toTray(c){delete state.pos[c.id];c.el.classList.remove("placed","drag");c.el.style.left=c.el.style.top="";sizeInTray(c);slots[c.id].querySelector(".holder").appendChild(c.el);slots[c.id].classList.remove("out");}
function putOnMap(c,x,y){sizeOnMap(c);overlay.appendChild(c.el);c.el.style.left=(x/VW*100)+"%";c.el.style.top=(y/VH*100)+"%";slots[c.id].classList.add("out");}
let drag=null;
function svgPoint(cx,cy){const r=mapbox.getBoundingClientRect();return{x:(cx-r.left)/r.width*VW,y:(cy-r.top)/r.height*VH,inside:cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom};}
function nearest(x,y){let best=null,bd=1e9;LM.forEach(l=>{const d=Math.hypot(l.x-x,(l.y-35)-y)/l.r;if(d<bd){bd=d;best=l;}});return bd<1.25?best:null;}
function startDrag(e,c){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();const el=c.el;const mw=mapbox.getBoundingClientRect().width*c.mapW/100;
  document.body.appendChild(el);el.classList.remove("placed");el.classList.add("drag");el.style.height="";el.style.width=Math.max(mw,40)+"px";const v=el.querySelector("svg");v.style.width="100%";v.style.height="auto";
  el.style.left=e.clientX+"px";el.style.top=e.clientY+"px";el.querySelector(".bubble")?.remove();drag={c};try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.addEventListener("pointermove",onMove);el.addEventListener("pointerup",onUp);el.addEventListener("pointercancel",onUp);}
function onMove(e){if(!drag)return;const el=drag.c.el;el.style.left=e.clientX+"px";el.style.top=e.clientY+"px";const p=svgPoint(e.clientX,e.clientY);const n=p.inside?nearest(p.x,p.y):null;LM.forEach(l=>l.el.classList.toggle("near",l===n));}
function onUp(e){if(!drag)return;const c=drag.c,el=c.el;el.removeEventListener("pointermove",onMove);el.removeEventListener("pointerup",onUp);el.removeEventListener("pointercancel",onUp);
  LM.forEach(l=>l.el.classList.remove("near"));el.classList.remove("drag");drag=null;const p=svgPoint(e.clientX,e.clientY);
  if(!p.inside){toTray(c);save();return;}placeAt(c,p.x,p.y);}
function placeAt(c,x,y){const l=nearest(x,y);
  if(l){const others=CHARS.filter(o=>o!==c&&state.pos[o.id]?.at===l.id).length;x=l.x+[-1,1,-1.4,1.4][others%4]*(l.r*.85);y=l.y+18;}
  else y+=20;
  x=Math.max(30,Math.min(970,x));y=Math.max(60,Math.min(930,y));state.pos[c.id]={x,y,at:l?l.id:null};save();
  putOnMap(c,x,y);void c.el.offsetWidth;c.el.classList.add("placed");
  if(l){activate(l);openCard(l,c);}else say(c.el,"這裡是"+districtAt(x,y)+"！");}
function districtAt(x,y){for(const d of DIST)if(inPoly(x,y,d.pts))return d.n;return "台北";}
function say(el,t,ms=2600){el.querySelector(".bubble")?.remove();const b=document.createElement("div");b.className="bubble";b.textContent=t;el.appendChild(b);setTimeout(()=>b.remove(),ms);}
function activate(l){l.el.classList.remove("active");void l.el.getBoundingClientRect();l.el.classList.add("active");setTimeout(()=>l.el.classList.remove("active"),2600);}

/* ================= 卡片 ================= */
let sheet=null;
function closeCard(){sheet?.remove();sheet=null;}
function openCard(l,c){closeCard();
  const who=c||CHARS.find(o=>state.pos[o.id]?.at===l.id)||CHARS[0];const line=pick(who.hi);if(c)say(c.el,line);activate(l);
  const done=!!state.stamps[l.id];
  sheet=document.createElement("div");sheet.className="sheet";sheet.setAttribute("role","dialog");sheet.setAttribute("aria-label",l.name);
  sheet.innerHTML=`<button class="close" aria-label="關閉">×</button><div class="top"><div class="face">${charSVG(who,"wow")}</div><div><span class="tag">${l.d}</span><h3>${l.name}</h3></div></div>
   <div class="say">${who.name}：${line}</div><p class="fact">${l.fact}</p>
   <div class="quiz"><p class="q">${done?"✓ 已經蓋過章了！再挑戰一次：":"數感挑戰："}${l.q}</p><div class="opts">${l.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div><p class="result" aria-live="polite"></p></div>`;
  document.body.appendChild(sheet);sheet.querySelector(".close").onclick=closeCard;
  const res=sheet.querySelector(".result");let tries=0;
  sheet.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(i===l.a){sheet.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("right");res.className="result ok";res.innerHTML="答對了！"+l.why;
      if(!state.stamps[l.id]){state.stamps[l.id]=1;save();renderPassport(l.id);confetti();toast(`蓋章成功：${l.name}`);if(Object.keys(state.stamps).length===LM.length)setTimeout(()=>toast("集滿 12 個章！你是台北數感大師"),900);}
      CHARS.filter(o=>state.pos[o.id]?.at===l.id).forEach(o=>say(o.el,"太棒了！"));
      walkers.filter(w=>Math.hypot(w.x-l.x,w.y-l.y)<l.r*1.6).forEach(w=>say(w.el,"好厲害！"));}
    else{tries++;b.classList.add("wrong");b.disabled=true;res.className="result no";res.textContent=tries>1?`${who.name} 提示：${l.why.split("，")[0]}…`:`${who.name}：再想一下，你可以的！`;}});
  sheet.querySelector(".opt").focus({preventScroll:true});}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard();});

const pp=$("passport");
function renderPassport(newId){pp.innerHTML="";LM.forEach(l=>{const b=document.createElement("button");const got=!!state.stamps[l.id];
  b.className="stamp"+(got?" got":"")+(l.id===newId?" new":"");b.textContent=got?l.name:l.d;b.title=l.name;b.onclick=()=>openCard(l,null);pp.appendChild(b);l.el.classList.toggle("done",got);});
  $("scoreN").textContent=Object.keys(state.stamps).length;}
renderPassport();

$("homeBtn").onclick=()=>{closeCard();CHARS.forEach(toTray);save();};
$("resetBtn").onclick=function(){if(this.dataset.armed){state.stamps={};save();renderPassport();this.textContent="清空護照";delete this.dataset.armed;toast("護照已清空");}
  else{this.dataset.armed=1;this.textContent="再按一次確認清空";setTimeout(()=>{if(this.dataset.armed){delete this.dataset.armed;this.textContent="清空護照";}},3000);}};
$("tourBtn").onclick=()=>{closeCard();const free=LM.filter(l=>!state.stamps[l.id]);const pool=(free.length?free:LM).slice().sort(()=>Math.random()-.5);
  CHARS.forEach(c=>delete state.pos[c.id]);
  CHARS.forEach((c,i)=>{const l=pool[i%pool.length];const others=CHARS.filter(o=>o!==c&&state.pos[o.id]?.at===l.id).length;
    const x=Math.max(30,Math.min(970,l.x+[-1,1,-1.4,1.4][others%4]*l.r*.85)),y=l.y+18;state.pos[c.id]={x,y,at:l.id};
    setTimeout(()=>{putOnMap(c,x,y);c.el.classList.remove("placed");void c.el.offsetWidth;c.el.classList.add("placed");say(c.el,c.hi[0]);activate(l);},i*180);});
  save();toast("小隊出發！點地標或拖曳角色開始挑戰");};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function confetti(){const cols=[C.teal,C.sky,C.red,C.orange,C.yellow,C.blue];for(let i=0;i<40;i++){const p=document.createElement("div");p.className="confetti";p.style.left=(10+Math.random()*80)+"vw";p.style.top="-20px";p.style.background=cols[i%cols.length];p.style.setProperty("--dx",(Math.random()*200-100)+"px");p.style.animationDelay=(Math.random()*.3)+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),1900);}}

if(!Object.keys(state.pos).length){const n=CHARS[0],l=LM[0];const x=l.x-l.r*.85,y=l.y+18;state.pos[n.id]={x,y,at:l.id};putOnMap(n,x,y);setTimeout(()=>say(n.el,"把大家拖到地標上吧！"),600);}

/* ================= 走動的聲紋遊客 ================= */
const ROUTES=[...MRT.map(m=>m.pts),...TRAILS];
function routeInfo(pts){const seg=[];let L=0;for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(l);L+=l;}return{pts,seg,L};}
const RI=ROUTES.map(routeInfo);
function at(ri,d){let i=0;while(i<ri.seg.length-1&&d>ri.seg[i]){d-=ri.seg[i];i++;}const t=Math.min(1,d/ri.seg[i]),a=ri.pts[i],b=ri.pts[i+1];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,b[0]-a[0]];}
const FW=180,FH=222,SC=.3;
function makePerson(){const g=Math.random()<.5?'boy':'girl',fi=Math.floor(Math.random()*FAMS.length),F=FAMS[fi],t=Math.random();
  const idx=Math.round(t*(F.list.length-1)),p=F.list[idx],col=PALS[(fi*5+Math.floor(t*.999*6))%PALS.length];
  const sim=makeSim(4200);sim.fi=fi;sim.p=p;settle(sim,260);
  const cv=document.createElement("canvas");cv.width=FW*4;cv.height=FH;const x=cv.getContext("2d");
  [-1,0,1,0].forEach((st,i)=>{x.save();x.translate(i*FW,0);x.scale(SC,SC);drawChar(x,g,sim,col,st,7);x.restore();});
  return{g,fi,p,col,sprite:cv.toDataURL("image/png"),thumb:cv};}
const walkers=[];const visList=$("visList");
const names=["小宇","阿芃","小晴","阿哲","米米","小安","大寶","阿綺","小樂","可可","阿傑","圓圓"];
function addWalker(){if(walkers.length>=12){toast("地圖上已經有 12 位遊客了");return;}
  const per=makePerson(),ri=RI[Math.floor(Math.random()*RI.length)];
  const w={...per,ri,d:Math.random()*ri.L,dir:Math.random()<.5?1:-1,speed:22+Math.random()*14,pause:0,last:null,name:names[walkers.length%names.length]};
  const el=document.createElement("div");el.className="walker walk";el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label",`遊客 ${w.name}`);
  el.style.backgroundImage=`url(${per.sprite})`;w.el=el;overlay.appendChild(el);
  el.onclick=()=>openWalker(w);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openWalker(w);}};
  const b=document.createElement("button");b.setAttribute("aria-label",`查看遊客 ${w.name}`);const tc=document.createElement("canvas");tc.width=FW;tc.height=FH;tc.getContext("2d").drawImage(per.thumb,FW,0,FW,FH,0,0,FW,FH);b.appendChild(tc);b.onclick=()=>openWalker(w);visList.appendChild(b);
  walkers.push(w);place(w);}
function place(w){const[x,y,dx]=at(w.ri,w.d);w.x=x;w.y=y;w.el.style.left=(x/VW*100)+"%";w.el.style.top=(y/VH*100)+"%";w.el.style.zIndex=Math.round(y/10);
  if(dx*w.dir<-.5)w.el.classList.add("flip");else if(dx*w.dir>.5)w.el.classList.remove("flip");}
function openWalker(w){closeCard();
  const F=FAMS[w.fi];sheet=document.createElement("div");sheet.className="sheet";sheet.setAttribute("role","dialog");
  const near=LM.slice().sort((a,b)=>Math.hypot(a.x-w.x,a.y-w.y)-Math.hypot(b.x-w.x,b.y-w.y))[0];
  sheet.innerHTML=`<button class="close" aria-label="關閉">×</button><div class="big"><canvas width="${W}" height="${H}"></canvas><div><span class="tag">聲紋遊客</span><h3>${w.name}</h3><p class="fact" style="margin-top:6px">衣服是 <b>${F.name} · ${F.label(w.p)}</b> 的克拉尼圖形，沙子停在式子等於 0 的節線上。</p></div></div>
   <div class="formula">${F.tex(w.p)}</div><div class="say">${w.name}：我正在${districtAt(w.x,w.y)}散步，離${near.name}很近喔！</div>`;
  document.body.appendChild(sheet);sheet.querySelector(".close").onclick=closeCard;
  const cv=sheet.querySelector("canvas"),ctx=cv.getContext("2d");
  const sim=makeSim(12000);sim.fi=w.fi;sim.p=w.p;settle(sim,280);drawChar(ctx,w.g,sim,w.col,0,2.6);
  say(w.el,"嗨！我是"+w.name);w.pause=Math.max(w.pause,2500);}
$("addWalker").onclick=()=>{addWalker();const w=walkers[walkers.length-1];if(w)say(w.el,"我也來逛台北！");};

let lastTs=0;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(ts){const dt=lastTs?Math.min(100,ts-lastTs):16;lastTs=ts;
  for(const w of walkers){
    if(w.pause>0){w.pause-=dt;if(w.pause<=0)w.el.classList.add("walk");continue;}
    w.d+=w.dir*w.speed*dt/1000;
    if(w.d>=w.ri.L||w.d<=0){w.d=Math.max(0,Math.min(w.ri.L,w.d));
      if(Math.random()<.5){w.dir*=-1;}else{const end=at(w.ri,w.d);const alt=RI.filter(r=>r!==w.ri).map(r=>{let best=1e9,bd=0;for(let k=0;k<=r.L;k+=10){const q=at(r,k);const dd=Math.hypot(q[0]-end[0],q[1]-end[1]);if(dd<best){best=dd;bd=k;}}return{r,best,bd};}).filter(o=>o.best<40);
        if(alt.length){const o=pick(alt);w.ri=o.r;w.d=o.bd;w.dir=o.bd<o.r.L/2?1:-1;}else w.dir*=-1;}}
    place(w);
    const l=LM.find(m=>Math.hypot(m.x-w.x,(m.y-10)-w.y)<m.r*.9);
    if(l&&w.last!==l.id){w.last=l.id;w.pause=1800;w.el.classList.remove("walk");say(w.el,pick(["哇！","好漂亮！","拍照！","原來這裡是"])+l.name.replace(/^/,""),1800);}
  }
  requestAnimationFrame(loop);}
try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);}catch(e){}
for(let i=0;i<8;i++){addWalker();await new Promise(r=>setTimeout(r,0));}
if(!reduce)requestAnimationFrame(loop);
})();
</script>
