<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Numi 注音冒險島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;700&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-screen game shell — sea-mint world map → island path → full-focus play stage. Single bright world, NUMiNAI mint brand. */
:root{
  --mint-50:#F6FCFB; --mint-100:#CDF5EF; --mint-200:#B3EAE1; --mint-300:#95DCD1; --mint-400:#82D3C6;
  --mint-500:#4DC6B2; --mint-600:#0AACA3; --mint-700:#049C94; --mint-900:#0F837D;
  --ink:#1F3B39; --ink-2:#4F6A67; --ink-3:#8AA19E; --line:#D6E9E5; --paper:#FFFFFF; --bg:#EEF9F6;
  --num:#3E9B3A; --numi:#FDE6CF; --sun:#FFD45C; --coral:#F28B6E; --pink:#F6B9C4; --berry:#E36B7E; --sky:#9DB4EE;
  --ok:#2FAE8F; --bad:#E2685A;
  --f-display:'Chiron GoRound TC','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --zy:'Noto Sans TC','Chiron GoRound TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --r:18px; --shadow:0 4px 0 rgba(15,131,125,.18);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--mint-700);outline-offset:3px;border-radius:12px}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:2px solid var(--line);flex:none}
.top h1{font-family:var(--f-display);font-size:1.15rem;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.ibtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--mint-50);border:2px solid var(--line);font-size:1.1rem;flex:none}
.ibtn:hover{background:var(--mint-100)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--mint-50);border:2px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.eureka{width:20px;height:20px;border-radius:50%;background:var(--sun);display:inline-grid;place-items:center;font-size:12px;color:#8A5A00;flex:none}
.ring{--p:0;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--mint-500) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--paper)}
.stage{flex:1;overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;font-weight:700;font-size:1.05rem;background:var(--mint-600);color:#fff;box-shadow:0 4px 0 var(--mint-900);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mint-900)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#5C3D00;box-shadow:0 4px 0 #D9A92E}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
h2{font-family:var(--f-display);font-size:1.35rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.05rem;margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--mint-900);font-weight:700}

/* zhuyin vertical */
.zv{display:inline-flex;flex-direction:column;align-items:center;position:relative;font-family:var(--zy);line-height:1;padding:0 .42em;vertical-align:middle}
.zc{display:flex;flex-direction:column;align-items:center}
.zc i{font-style:normal;line-height:1.06;display:block}
.zc i.hl{color:var(--berry);text-shadow:0 0 0 currentColor}
.zt{font-size:1em;line-height:1;color:inherit;font-weight:700;-webkit-text-stroke:.02em currentColor}
.zt-r{position:absolute;right:-.28em;top:calc((var(--n) - 1) * 1.06em - .05em)}
.zt-l{position:absolute;left:-.28em;top:calc((var(--n) - 1) * 1.06em - .05em)}
.zt-b{line-height:.9}
.zt-top{line-height:.55;margin-bottom:.05em}
.rb{display:inline-flex;align-items:center;margin:0 .06em}
.rb-c{font-family:var(--f-display);font-weight:700}
.rb .zv{font-size:.4em;padding-left:.15em}
.zh{font-family:var(--zy);letter-spacing:.04em}

/* map */
.map{position:relative;width:100%;aspect-ratio:1000/640;max-width:100%;border-radius:28px;overflow:hidden;border:3px solid var(--mint-300);background:var(--mint-100)}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.isl-btn{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px 8px;border-radius:18px;background:rgba(255,255,255,.92);border:2px solid var(--line);box-shadow:var(--shadow);min-width:96px;transition:transform .15s}
.isl-btn:hover{transform:translate(-50%,-54%)}
.isl-btn b{font-family:var(--f-display);font-size:clamp(.72rem,1.6vw,1rem);white-space:nowrap}
.isl-btn small{font-size:clamp(.62rem,1.2vw,.8rem);color:var(--ink-2);white-space:nowrap}
.isl-btn .por{width:clamp(34px,6vw,56px);height:clamp(34px,6vw,56px)}
.isl-btn.locked{filter:grayscale(.9);opacity:.75}
.lockb{position:absolute;top:-10px;right:-10px;background:var(--ink);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:.8rem}
.medal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:.7rem;font-weight:700}
.medal.gold{background:#F8CF45;color:#6B4A00}.medal.silver{background:#D7DEE2;color:#3D4B52}.medal.bronze{background:#E9AE7E;color:#5C3214}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.menu-tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--paper);border:2px solid var(--line);box-shadow:var(--shadow);text-align:left;font-weight:700}
.menu-tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;flex:none}
.menu-tile span small{display:block;font-weight:400;color:var(--ink-2);font-size:.8rem}
.por{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--mint-50);display:grid;place-items:center;flex:none;border:2px solid var(--line)}
.por img,.por svg{width:100%;height:100%;object-fit:cover}

/* island path */
.isl-head{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);border:2px solid var(--line)}
.isl-head .por{width:72px;height:72px;background:#fff}
.path-box{border-radius:28px;padding:8px;border:3px solid var(--line)}
.path-box>svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node:focus-visible circle.n-face{stroke:var(--ink);stroke-width:5}
.node.lock{cursor:not-allowed}
.sheet{position:fixed;inset:0;background:rgba(15,59,55,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet>.card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out;max-height:88vh;overflow:auto}
.sheet.center{align-items:center}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

/* play */
.play{height:100%;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:2px solid var(--line)}
.prog{flex:1;height:14px;background:var(--mint-50);border-radius:99px;overflow:hidden;border:2px solid var(--line);min-width:60px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint-400),var(--mint-600));border-radius:99px;transition:width .3s}
.pbody{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.qhead{font-family:var(--f-display);font-size:1.25rem;font-weight:700;text-align:center;text-wrap:balance;display:flex;align-items:center;gap:10px}
.qhead .por{width:44px;height:44px}
.qprompt{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:150px;justify-content:center}
.listen-big{width:130px;height:130px;border-radius:40px;background:var(--mint-500);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--mint-900);animation:pulse 1.8s ease-in-out infinite}
.listen-big svg{width:62px;height:62px}
@keyframes pulse{50%{transform:scale(1.05)}}
.big-sym{font-family:var(--zy);font-size:130px;line-height:1;color:var(--mint-900)}
.big-char{font-family:var(--f-display);font-size:96px;font-weight:700;line-height:1}
.emoji{font-size:84px;line-height:1}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:560px}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{min-height:110px;border-radius:22px;background:var(--paper);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:10px;position:relative;font-size:1.1rem;font-weight:700;transition:transform .08s}
.opt:hover{border-color:var(--mint-400)}
.opt:active{transform:translateY(3px)}
.opt .k{position:absolute;top:8px;left:10px;font-size:.75rem;color:var(--ink-3);font-weight:700}
.opt.good{background:#E3F7EF;border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.opt.bad{background:#FDECE8;border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.zy-big{font-family:var(--zy);font-size:64px;line-height:1}
.opt .zv{font-size:40px}
.opt .emoji{font-size:64px}
.sndopt{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:10px;border-radius:22px;border:3px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line)}
.sndopt .play-s{height:76px;border-radius:16px;background:var(--mint-100);display:grid;place-items:center}
.sndopt .play-s svg{width:38px;height:38px;color:var(--mint-900)}
.sndopt .pick{padding:10px;border-radius:12px;background:var(--mint-600);color:#fff;font-weight:700}
.sndopt.good{border-color:var(--ok);background:#E3F7EF}.sndopt.bad{border-color:var(--bad);background:#FDECE8;animation:shake .35s}
.fb{position:fixed;left:0;right:0;bottom:0;padding-block:14px max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-weight:700;font-size:1.15rem;z-index:20;animation:up .2s}
.fb.ok{background:#E3F7EF;color:#156E58;border-top:3px solid var(--ok)}
.fb.no{background:#FDECE8;color:#9C3326;border-top:3px solid var(--bad)}
.fb .rv{font-size:1.6rem;display:inline-flex;align-items:center;gap:6px}
.eq{display:flex;align-items:center;gap:14px;font-family:var(--zy);font-size:72px;line-height:1}
.eq b{font-size:42px;color:var(--ink-3)}
.eq .tile{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow)}
.contour{width:58px;height:38px}
.combo{font-weight:700;color:var(--coral);min-width:3.5em;text-align:right;font-variant-numeric:tabular-nums}
.float{position:fixed;font-weight:700;color:#8A5A00;pointer-events:none;animation:fl .9s ease-out forwards;z-index:60}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}

/* build */
.slots{display:flex;gap:8px;align-items:center}
.slot{width:64px;height:72px;border-radius:16px;border:3px dashed var(--mint-300);display:grid;place-items:center;font-family:var(--zy);font-size:44px;background:var(--paper)}
.slot.tone{width:52px;border-color:var(--sun)}
.slot.filled{border-style:solid;border-color:var(--mint-500)}
.keys{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
.key{min-width:60px;height:62px;border-radius:16px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--zy);font-size:34px;padding:0 10px}
.key.tk{background:#FFF6DA;border-color:#F3D98A;box-shadow:0 4px 0 #F3D98A;font-size:40px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.key.tk small{font-family:var(--f-body);font-size:.7rem;margin-top:4px}
.key:active{transform:translateY(3px)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;width:100%;max-width:520px}
.match .col{display:flex;flex-direction:column;gap:12px}
.mi{min-height:84px;border-radius:18px;background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.mi .emoji{font-size:52px}
.mi .zv{font-size:30px}
.mi.sel{border-color:var(--mint-600);background:var(--mint-50)}
.mi.done{opacity:.3;pointer-events:none}
.mi.bad{border-color:var(--bad);animation:shake .3s}

/* demo */
.demo{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:18px}
.demo-card{width:100%;background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:var(--shadow)}
.demo-sym{font-family:var(--zy);font-size:160px;line-height:1;color:var(--mint-900);animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.demo-word{display:flex;align-items:center;gap:14px;font-size:72px}
.demo-word .emoji{font-size:72px}
.tone-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.tone-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;border:2px solid var(--line);background:var(--mint-50);transition:all .2s}
.tone-cell.on{background:var(--sun);border-color:#E8B73A;transform:translateY(-6px)}
.tone-cell .zv{font-size:46px}
.tone-cell b{font-family:var(--f-display);font-size:36px}
.join{display:flex;align-items:center;gap:6px;font-family:var(--zy);font-size:84px;line-height:1}
.join .a{animation:ja 1.2s ease-in-out both}.join .b{animation:jb 1.2s ease-in-out both}
@keyframes ja{from{transform:translateX(-60px)}}@keyframes jb{from{transform:translateX(60px)}}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--mint-600)}
.note{background:#FFF6DA;border-radius:16px;padding:12px 16px;font-size:1rem;line-height:1.6;max-width:60ch}

/* minigames */
.mg{position:relative;width:100%;max-width:900px;border-radius:26px;overflow:hidden;border:3px solid var(--line);user-select:none;touch-action:none}
.mg-hud{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.target{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-weight:700;font-size:1.1rem}
.target .zy-big{font-size:40px}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px;background:linear-gradient(#BFE6A7,#8FCB79)}
.hole{aspect-ratio:1.25;position:relative;overflow:hidden;border-radius:50% 50% 24px 24px}
.hole::after{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:28%;border-radius:50%;background:#4E7B3B}
.clone{position:absolute;left:50%;bottom:6%;width:62%;transform:translate(-50%,110%);transition:transform .18s ease-out;z-index:1;cursor:pointer}
.clone.up{transform:translate(-50%,0)}
.clone.hit{transform:translate(-50%,0) scale(.85) rotate(-10deg);filter:brightness(1.1)}
.clone .lab{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-family:var(--zy);font-size:clamp(20px,4vw,34px);font-weight:700;color:var(--ink);background:#fff;border-radius:12px;padding:0 6px;line-height:1.2}
.field{position:relative;height:min(62vh,520px);background:linear-gradient(#DDF6F1,#F6FCFB 70%,#CFEBC0 70%)}
.apple{position:absolute;width:64px;height:64px;margin-left:-32px;display:grid;place-items:center}
.apple img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:12px}
.apple span{position:relative;font-family:var(--zy);font-size:26px;font-weight:700;background:#fff;border-radius:10px;padding:0 5px;line-height:1.2}
.basket{position:absolute;bottom:6px;width:110px;margin-left:-55px}
.drop{position:absolute;transform:translateX(-50%);background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:6px 12px;text-align:center;box-shadow:var(--shadow)}
.drop.active{border-color:var(--mint-600)}
.drop .c{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1}
.drop .h{font-family:var(--zy);font-size:18px;color:var(--ink-3)}
.drop .h b{color:var(--mint-700)}
.kb{display:flex;flex-direction:column;gap:5px;align-items:center;padding:10px;background:var(--mint-50);border-top:2px solid var(--line)}
.kb .kr{display:flex;gap:5px}
.kb button{width:clamp(26px,7vw,52px);height:44px;border-radius:10px;background:var(--paper);border:2px solid var(--line);font-family:var(--zy);font-size:clamp(14px,2.6vw,20px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.kb button small{font-family:var(--f-body);font-size:9px;color:var(--ink-3)}
.kb button.tn{background:#FFF6DA}
.kb button.hit{background:var(--mint-300)}
.kb .space{width:min(60vw,320px)}
.bubble{position:absolute;width:84px;height:84px;margin-left:-42px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(157,180,238,.55) 60%,rgba(157,180,238,.8));border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;cursor:pointer}
.bubble b{font-family:var(--zy);font-size:52px;line-height:1;font-weight:700}
.bubble small{position:absolute;bottom:10px;font-size:.7rem;font-weight:700}
.belt{position:relative;height:min(56vh,460px);background:linear-gradient(#F6FCFB,#E5F4F1)}
.bins{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr}
.bin{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-size:1.3rem;font-weight:700;border-top:4px dashed rgba(0,0,0,.08)}
.bin small{font-family:var(--f-body);font-size:.8rem;font-weight:400}
.bin.l{background:#E4F3D9}.bin.r{background:#FFF0E0}
.item{position:absolute;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:24px;background:#fff;border:3px solid var(--mint-400);display:grid;place-items:center;font-family:var(--zy);font-size:48px;transition:left .25s,top .25s}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px;background:var(--mint-100)}
.mc{display:block;width:100%;padding:0;aspect-ratio:3/4;border-radius:18px;perspective:600px;cursor:pointer}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.open .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:grid;place-items:center;border:3px solid var(--line)}
.mc .b{background:var(--mint-500);color:#fff;font-family:var(--zy);font-size:40px}
.mc .f{background:#fff;transform:rotateY(180deg)}
.mc .f .emoji{font-size:clamp(34px,7vw,60px)}
.mc .f .zv{font-size:clamp(16px,3.4vw,28px)}
.mc.done .f{border-color:var(--ok);background:#E3F7EF}

/* pet */
.pet{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:84px;height:84px;z-index:15;pointer-events:none}
.pet img{width:100%;height:100%;object-fit:contain;border-radius:16px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.pet.bounce{animation:bnc .5s}
.pet.glow img{filter:drop-shadow(0 0 10px #FFE27A) drop-shadow(0 0 18px #9DE4FF)}
@keyframes bnc{30%{transform:translateY(-22px) rotate(-8deg)}60%{transform:translateY(0) rotate(4deg)}}
.pfx{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
.bub{position:fixed;width:16px;height:16px;border-radius:50%;border:2px solid #9DE4FF;background:rgba(255,255,255,.6);pointer-events:none;animation:bubu 1.4s ease-out forwards;z-index:16}
@keyframes bubu{to{transform:translate(var(--dx),-120px);opacity:0}}

/* chance cards */
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ccard{display:block;width:100%;aspect-ratio:3/4;perspective:700px;padding:0}
.ccard .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.ccard.open .in{transform:rotateY(180deg)}
.ccard .b,.ccard .f{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;text-align:center}
.ccard .b{background:repeating-linear-gradient(45deg,var(--mint-500) 0 10px,var(--mint-400) 10px 20px);color:#fff;font-size:2.2rem;font-family:var(--zy);border:3px solid #fff;box-shadow:var(--shadow)}
.ccard .f{background:#fff;border:3px solid var(--sun);transform:rotateY(180deg);font-weight:700;font-size:.85rem}
.ccard .f .ic{font-size:1.9rem}
.ccard.mine .f{border-color:var(--mint-600);background:#FFF9E5}

/* shop & album */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:700}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item-c{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:var(--r);background:var(--paper);border:2px solid var(--line);text-align:center}
.item-c .av{width:84px;height:84px}
.item-c img{width:84px;height:84px;object-fit:contain;border-radius:12px}
.rar{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px}
.rar.N{background:#E9EEF0;color:#4E5C62}.rar.SR{background:#DCE4FF;color:#3B4FA8}.rar.SSR{background:linear-gradient(90deg,#FFE27A,#FFB4D6,#9DE4FF);color:#5A2D00}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.symc{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--zy);font-size:30px;border:2px solid var(--line);background:var(--paper);color:var(--ink-3)}
.symc small{font-family:var(--f-body);font-size:.66rem;font-variant-numeric:tabular-nums}
.symc.seen{background:#FFF6DA;color:var(--ink);border-color:#F3D98A}
.symc.m{background:var(--mint-100);color:var(--mint-900);border-color:var(--mint-400)}
.symc.lo{background:#FDECE8;color:#9C3326;border-color:#F3B8AE}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--paper)}
.badge.off{opacity:.5}
.badge .bi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;flex:none;background:var(--line)}
.badge.on .bi{background:var(--sun)}
.badge b{display:block;font-size:.95rem}.badge small{color:var(--ink-2);font-size:.78rem}
/* profiles */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center}
.hero h2{font-size:clamp(1.8rem,4.6vw,3rem);line-height:1.15}
.hero .cast{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:var(--r);background:var(--paper);border:2px solid var(--line);box-shadow:var(--shadow);font-weight:700}
.pcard .av{width:84px;height:84px}
.pcard.new{border-style:dashed;color:var(--mint-900);justify-content:center;min-height:150px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.sel-av{padding:6px;border-radius:16px;border:2px solid var(--line);background:var(--paper)}
.sel-av.on{border-color:var(--ink);background:var(--mint-50)}
input[type=text],input[type=number]{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%}
/* dialog */
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(15,59,55,.25))}
.dlg .box{width:100%;max-width:720px;display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:3px solid var(--mint-400);border-radius:24px;padding:14px 16px;box-shadow:0 8px 24px rgba(15,59,55,.18);animation:up .25s}
.dlg .por{width:76px;height:76px}
.dlg .who{font-family:var(--f-display);font-weight:700;color:var(--mint-900)}
.dlg p{margin:4px 0 10px;font-size:1.1rem;line-height:1.6}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end}
.dlg .acts .btn{padding:8px 16px;font-size:.95rem}
/* teacher */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--ink-2)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:140px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.75rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bars i{display:block;width:70%;background:var(--mint-500);border-radius:8px 8px 3px 3px;min-height:3px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:90;animation:up .2s;max-width:90vw;text-align:center}

/* v2 additions */
.sndopt .play-s .emoji{font-size:64px;line-height:1}
.sndopt.pic .play-s{height:110px;background:#fff;border:2px solid var(--line)}
.zc i.blank{color:var(--coral);border:3px dashed var(--coral);border-radius:8px;padding:0 .06em;margin:.03em 0}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:480px}
.fc{aspect-ratio:1;border-radius:18px;background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--zy);font-size:clamp(32px,8vw,52px)}
.fc.good{background:#E3F7EF;border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.fc.bad{background:#FDECE8;border-color:var(--bad);animation:shake .35s}
.tracebox{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%;border-radius:24px;border:3px solid var(--line);background:linear-gradient(var(--line),var(--line)) center/100% 2px no-repeat,linear-gradient(var(--line),var(--line)) center/2px 100% no-repeat,#fff}
.tracebox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:22px}
.train{display:flex;align-items:flex-end;gap:6px;padding:8px 12px 14px;background:linear-gradient(#8AA19E,#8AA19E) bottom/100% 5px no-repeat;max-width:100%;overflow-x:auto}
.train .engine{width:76px;flex:none}
.car{width:72px;height:80px;flex:none;border-radius:14px 14px 8px 8px;background:#fff;border:3px dashed var(--mint-400);font-family:var(--zy);font-size:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.car.full{border-style:solid;background:var(--mint-50)}
.car.tc{border-color:#E8B73A;background:#FFF9E5}
.car small,.tile2 small{font-family:var(--f-body);font-size:.68rem}
.train.go{animation:chug 1.1s ease-in forwards}
@keyframes chug{60%{transform:translateX(24px)}to{transform:translateX(60px);opacity:.4}}
.train.bad{animation:shake .35s}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;max-width:520px}
.tile2{width:66px;height:66px;border-radius:16px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--zy);font-size:36px;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:grab}
.tile2.tn{background:#FFF6DA;border-color:#F3D98A}
.dragghost{position:fixed;z-index:80;pointer-events:none;transform:scale(1.12);box-shadow:0 10px 20px rgba(0,0,0,.18)}
.pad{display:flex;flex-direction:column;align-items:center;gap:6px}
.pad>div{display:flex;gap:6px}
.pad button{width:64px;height:54px;border-radius:14px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:1.3rem;touch-action:none}
.bingo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:440px;padding:14px;background:var(--mint-100);border-radius:24px}
.bc{aspect-ratio:1;border-radius:16px;background:#fff;border:3px solid var(--line);font-family:var(--zy);font-size:clamp(28px,7vw,44px);position:relative}
.bc.on{background:var(--sun);border-color:#E8B73A}
.bc.on::after{content:"";position:absolute;inset:10%;border:4px solid var(--berry);border-radius:50%;opacity:.75}
.bc.bad{animation:shake .35s;border-color:var(--bad)}
.bc.hint{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)}
.river{position:relative;height:min(58vh,460px);background:repeating-linear-gradient(0deg,#9FDCEB 0 22px,#B6E7F1 22px 44px);overflow:hidden}
.river .far,.river .near{position:absolute;left:0;right:0;background:#C6DE76;display:grid;place-items:center;font-weight:700}
.river .far{top:0;height:16%}.river .near{bottom:0;height:20%}
.stones{position:absolute;left:0;right:0;top:30%;display:flex;justify-content:space-around;padding:0 3%;gap:8px}
.stone{width:min(27vw,150px);min-height:118px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:#E4DED0;border:4px solid #B9B0A0;box-shadow:0 8px 0 #9E9584;display:grid;place-items:center;font-size:clamp(24px,5vw,38px)}
.stone.good{background:#CDEFD9;border-color:var(--ok)}
.stone.sink{animation:sink 1s forwards}
@keyframes sink{to{transform:translateY(40px) scale(.8);opacity:.3}}
.me{position:absolute;left:50%;bottom:4%;width:76px;margin-left:-38px;transition:left .45s cubic-bezier(.3,1.4,.6,1),bottom .45s cubic-bezier(.3,1.4,.6,1);z-index:2}
.rprog{position:absolute;left:10px;right:10px;top:18%;height:8px;background:rgba(255,255,255,.7);border-radius:9px;overflow:hidden}
.rprog i{display:block;height:100%;width:0;background:var(--mint-600);transition:width .4s}
.bal{position:absolute;width:88px;height:106px;margin-left:-44px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:grid;place-items:center;font-size:46px;border:0;cursor:pointer}
.bal::after{content:"";position:absolute;bottom:-24px;left:50%;width:2px;height:24px;background:#8AA19E}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .opts.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .big-sym{font-size:100px}.demo-sym{font-size:120px}.eq{font-size:52px}.join{font-size:64px}
  .cards4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .isl-btn{min-width:0;padding:3px 6px;gap:1px}.isl-btn small{display:none}.isl-btn .por{width:28px;height:28px}.isl-btn b{font-size:.68rem}
  .top .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  if(b[0]==='˙'){tone=5;b=b.slice(1)}

  if('ˊˇˋ'.includes(last)){tone={'ˊ':2,'ˇ':3,'ˋ':4}[last];b=b.slice(0,-1)}
  const syms=[...b];const sheng=isSheng(syms[0])?syms[0]:'';
  return {z,syms,tone,sheng,rime:syms.slice(sheng?1:0).join(''),body:b};
}

function islandMedal(p,isl){

  const tot=isl.nodes.reduce((a,n)=>a+(p.stars[n.id]||0),0)/(isl.nodes.length*3);

function stat(sym,ok){const p=P();if(!p||!sym)return;const s=p.stats[sym]||(p.stats[sym]={a:0,c:0});s.a++;if(ok)s.c++}
function tstat(t,ok){const p=P();const s=p.tones[t]||(p.tones[t]={a:0,c:0});s.a++;if(ok)s.c++}
function confuse(a,b){if(!a||!b||a===b)return;const p=P();const k=a+'>'+b;p.confuse[k]=(p.confuse[k]||0)+1}
const mastered=s=>{const st=P().stats[s];return st&&st.a>=4&&st.c/st.a>=.8};
const acc=st=>st&&st.a?st.c/st.a:null;
function weakest(n=6){
  const p=P();
  return ALLSYM.map(s=>{const st=p.stats[s];return {s,v:st&&st.a?st.c/st.a-(st.a<3?.1:0):.55}}).sort((a,b)=>a.v-b.v).slice(0,n).map(x=>x.s);
}

function checkAch(){
  const p=P();

  if(p.cards)grant('chance');
  if(p.maxCombo>=10)grant('combo10');
  if(SHENG.every(mastered))grant('sheng');
  if(YUNALL.every(mastered))grant('yun');
  if(ALLSYM.every(mastered))grant('all37');
  if([1,2,3,4].every(t=>{const s=p.tones[t];return s&&s.a>=4&&s.c/s.a>=.8}))grant('tone');
  if((p.best.typing||0)>=150)grant('type');
  if((p.best.whack||0)>=150)grant('whack');
  if(p.pets.some(x=>PETS.find(q=>q.id===x).rar==='SSR'))grant('ssr');
  if(p.totalSec>=3600)grant('time60');
  if(ISLANDS.some(i=>islandMedal(p,i)==='gold'))grant('gold');
  if(p.medal>=1)grant('test');
  save();
}

function dialog(lines){
  return new Promise(res=>{
    let i=0;const d=document.createElement('div');d.className='dlg';document.body.appendChild(d);
    const show=()=>{
      if(i>=lines.length){hush();d.remove();res();return}
      const [who,text]=lines[i];
      d.innerHTML=`<div class="box" role="dialog" aria-live="polite">${portrait(who)}<div style="flex:1;min-width:0"><div class="who">${WHO[who].name}</div><p>${esc(text)}</p><div class="acts"><button class="btn ghost" data-a="skip">跳過</button><button class="btn" data-a="next">${i<lines.length-1?'下一句':'好！'}</button></div></div></div>`;
      if(S().readDialog)speak(text.replace(/[（(].*?[）)]/g,''));
      $('[data-a=next]',d).onclick=()=>{i++;show()};
      $('[data-a=skip]',d).onclick=()=>{i=lines.length;show()};
      $('[data-a=next]',d).focus();
    };
    show();
  });
}

}

function blob(cx,cy,r,seed){
  const pts=[];const k=16;
  for(let i=0;i<k;i++){const a=i/k*Math.PI*2;const rr=r*(1+.13*Math.sin(a*3+seed)+.08*Math.sin(a*5+seed*2.3));pts.push([cx+rr*Math.cos(a),cy+rr*.72*Math.sin(a)])}
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<k;i++){const p0=pts[(i-1+k)%k],p1=pts[i],p2=pts[(i+1)%k],p3=pts[(i+2)%k];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  return d+'Z';
}
function islandDeco(isl){
  let s='';const R=isl.r;
  const spots=[[-.5,-.15],[.45,-.2],[-.2,.25],[.3,.3],[-.6,.2],[.6,.1]];
  spots.forEach(([dx,dy],i)=>{const x=isl.x+dx*R,y=isl.y+dy*R*.7;
    if(isl.id==='forest')s+=`<circle cx="${x}" cy="${y}" r="${14+i%3*4}" fill="#6DB25A"/><circle cx="${x-5}" cy="${y-4}" r="5" fill="#FDE6CF"/>`;
    else if(isl.id==='gear')s+=`<circle cx="${x}" cy="${y}" r="${11+i%2*5}" fill="none" stroke="#0AACA3" stroke-width="6" stroke-dasharray="5 4"/>`;
    else if(isl.id==='star')s+=`<path d="M${x},${y-12} L${x+4},${y-3} L${x+13},${y-2} L${x+6},${y+4} L${x+8},${y+13} L${x},${y+8} L${x-8},${y+13} L${x-6},${y+4} L${x-13},${y-2} L${x-4},${y-3}Z" fill="#FFD45C"/>`;
    else if(isl.id==='dojo')s+=`<rect x="${x-10}" y="${y-10}" width="20" height="20" rx="4" fill="#E2B285"/>`;
    else s+=`<path d="M${x-12},${y+10} L${x},${y-14} L${x+12},${y+10}Z" fill="#E28B80"/>`;
  });
  return s;
}

const nOpt=()=>S().opts;
function symDistract(t,n,prefer=[]){
  const same=isSheng(t)?SHENG:YUNALL;
  const c=shuffle([...(CONF[t]||'')].filter(x=>x!==t)).slice(0,Math.min(2,n));
  const rest=shuffle(uniq([...shuffle(prefer.filter(x=>same.includes(x))),...shuffle(same)])).filter(x=>x!==t&&!c.includes(x));
  return [...c,...rest].slice(0,n);
}
function poolFor(syms,need=()=>true){

  let c=POOL.filter(e=>need(e)&&(full||e.p.syms.some(s=>set.has(s))));
  if(c.length<4)c=POOL.filter(need);

}

    opts:[{html:'<b style="font-size:1.6rem">聲母</b><small class="muted">在字的開頭</small>',ok:sh},{html:'<b style="font-size:1.6rem">韻母</b><small class="muted">可以自己唱長長的</small>',ok:!sh}],ans:t,track:[t],reveal:sh?'聲母':'韻母',after:()=>[symSound(t)]}};
GEN.p4=ctx=>{const e=pick(poolFor(ctx.syms,x=>x.p.sheng&&x.p.rime));const {sheng,rime,tone}=e.p;
  const cand=new Set();
  symDistract(sheng,4).forEach(s=>cand.add(fmtZ(s+rime,tone)));

  shuffle(rimes).slice(0,3).forEach(r=>cand.add(fmtZ(sheng+r,tone)));

    function bindTile(b){
      b.onpointerdown=e=>{

        const r=b.getBoundingClientRect();const ox=sx-r.left,oy=sy-r.top;
        const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){moved=true;document.body.appendChild(g);b.style.visibility='hidden'}if(moved){g.style.left=(ev.clientX-ox)+'px';g.style.top=(ev.clientY-oy)+'px'}};
        const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);

MINI.snake=o=>{
  miniIntro(o,'πmi 變成貪吃蛇了！上面會出現一個字，<b>依照順序吃掉它的注音，最後吃聲調</b>。<br>用方向鍵、滑動或下面的按鈕轉彎。撞到自己會少一顆心。75 秒。',start);
  function start(){
    const W=16,H=11,CS=40;
    o.pb.innerHTML=`<div class="mg-hud"><span class="target" id="tg"></span><span class="target" id="lv">❤️❤️❤️</span></div>
      <div class="mg" style="max-width:640px"><canvas id="cv" width="${W*CS}" height="${H*CS}" style="width:100%;display:block;touch-action:none"></canvas></div>
      <div class="pad"><button data-d="0,-1" aria-label="上">▲</button><div><button data-d="-1,0" aria-label="左">◀</button><button data-d="0,1" aria-label="下">▼</button><button data-d="1,0" aria-label="右">▶</button></div></div>`;
    const cv=$('#cv'),cx=cv.getContext('2d');
    let snake,dir,nd,e,seq,k,items=[],lives=3;
    const reset=()=>{snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];dir={x:1,y:0};nd=dir};
    const free=()=>{for(let n=0;n<500;n++){const p={x:rnd(W),y:rnd(H)};if(!snake.some(s=>s.x===p.x&&s.y===p.y)&&!items.some(i=>i.x===p.x&&i.y===p.y)&&Math.abs(p.x-snake[0].x)+Math.abs(p.y-snake[0].y)>2)return p}return {x:0,y:0}};
    const place=()=>{items=[];const need=seq[k];const decoys=TONEP.includes(need)?shuffle(TONEP.filter(t=>t!==need)).slice(0,2):symDistract(need,3);[need,...decoys].forEach(s=>items.push({...free(),s}))};
    const hud=()=>{$('#tg').innerHTML=`<span style="font-family:var(--f-display);font-size:1.8rem">${e.c}</span> ${seq.map((s,i)=>`<span class="zh" style="font-size:1.5rem;${i<k?'color:var(--mint-700)':i===k?'text-decoration:underline;text-underline-offset:6px':'color:var(--ink-3)'}">${s}</span>`).join(' ')}`};
    const newWord=()=>{e=pick(POOL.filter(x=>x.p.tone<=4&&x.p.syms.length>=2));seq=[...e.p.syms,tonePiece(e.p.tone)];k=0;hud();place();speak(e.c)};
    const setDir=(x,y)=>{if(x===-dir.x&&y===-dir.y)return;nd={x,y}};
    reset();newWord();
    o.onKey(ev=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[ev.key];if(m){ev.preventDefault();setDir(...m)}});
    $$('[data-d]').forEach(b=>b.onpointerdown=ev=>{ev.preventDefault();setDir(...b.dataset.d.split(',').map(Number))});
    let sw=null;cv.onpointerdown=ev=>{sw=[ev.clientX,ev.clientY]};cv.onpointerup=ev=>{if(!sw)return;const dx=ev.clientX-sw[0],dy=ev.clientY-sw[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20){if(Math.abs(dx)>Math.abs(dy))setDir(Math.sign(dx),0);else setDir(0,Math.sign(dy))}sw=null};
    o.ctl.rep=()=>speak(e.c);
    const lv=()=>{$('#lv').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(3-Math.max(0,lives))};
    const step=()=>{
      dir=nd;const h={x:(snake[0].x+dir.x+W)%W,y:(snake[0].y+dir.y+H)%H};
      if(snake.slice(0,-1).some(s=>s.x===h.x&&s.y===h.y)){lives--;SFX.no();lv();if(lives<=0){o.end();return}reset();place();return}
      snake.unshift(h);
      const it=items.find(i=>i.x===h.x&&i.y===h.y);
      if(it){
        if(it.s===seq[k]){k++;SFX.ok();o.setScore(o.score+5);if(!TONEP.includes(it.s))stat(it.s,true);
          if(k>=seq.length){o.setScore(o.score+20);speak(e.c);petReact(5);newWord()}else{hud();place()}}
        else{SFX.no();o.setScore(o.score-3);if(!TONEP.includes(seq[k])){stat(seq[k],false);confuse(seq[k],it.s)}snake.pop();if(snake.length>3)snake.pop();items=items.filter(i=>i!==it);items.push({...free(),s:it.s})}
      }else snake.pop();
    };
    const rr=(x,y,w,h,r)=>{cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()};
    const draw=()=>{
      cx.fillStyle='#F6FCFB';cx.fillRect(0,0,W*CS,H*CS);cx.fillStyle='#EAF7F3';
      for(let y=0;y<H;y++)for(let x=0;x<W;x++)if((x+y)%2)cx.fillRect(x*CS,y*CS,CS,CS);
      items.forEach(i=>{rr(i.x*CS+2,i.y*CS+2,CS-4,CS-4,9);cx.fillStyle=TONEP.includes(i.s)?'#FFF6DA':'#fff';cx.fill();cx.lineWidth=2.5;cx.strokeStyle='#82D3C6';cx.stroke();
        cx.fillStyle='#1F3B39';cx.font='700 26px "Noto Sans TC","PingFang TC",sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(i.s,i.x*CS+CS/2,i.y*CS+CS/2+1)});
      for(let n=snake.length-1;n>=0;n--){const s=snake[n];cx.fillStyle=n===0?'#0AACA3':'#82D3C6';cx.beginPath();cx.arc(s.x*CS+CS/2,s.y*CS+CS/2,CS*.46,0,7);cx.fill()}
      const hd=snake[0];const ex=hd.x*CS+CS/2,ey=hd.y*CS+CS/2;
      [[-1],[1]].forEach(([sg])=>{const px=ex+(dir.y?sg*8:dir.x*6),py=ey+(dir.x?sg*8:dir.y*6);cx.fillStyle='#fff';cx.beginPath();cx.arc(px,py,6,0,7);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.arc(px+dir.x*2,py+dir.y*2,3,0,7);cx.fill()});
    };
    draw();
    o.every(()=>{step();draw()},190);
    o.timer(75,()=>o.end());
  }
};

  }

    <div class="row" style="justify-content:space-between"><div class="tabs">${[['acc','配件'],['look','外形與顏色'],['gacha','歷史道具扭蛋']].map(([k,n])=>`<button class="tab ${tab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>
    ${p.coupons?`<label class="chip"><input type="checkbox" id="cp" ${useCp?'checked':''}> 使用 5 折券（剩 ${p.coupons} 張）</label>`:''}</div>
    ${body}</div></div>`;
  bindTop();
  $$('[data-tab]').forEach(b=>b.onclick=()=>go('shop',b.dataset.tab));
  const cp=$('#cp');if(cp)cp.onchange=()=>{SCREENS.shop._cp=cp.checked;go('shop',tab)};
  $$('[data-buy]').forEach(b=>b.onclick=()=>{
    const [kind,id]=b.dataset.buy.split(':');const it=kind==='acc'?ACC.find(a=>a.id===id):kind==='shape'?SHAPES.find(s=>s.id===id):COLORS.find(c=>c.id===id);
    const cost=price(it.price);if(p.coins<cost)return;
    p.coins-=cost;p.owned.push(kind==='acc'?id:kind+':'+id);if(useCp){p.coupons--;SCREENS.shop._cp=false}
    if(kind==='acc'){p.look.acc=p.look.acc||{};p.look.acc[it.slot]=id}else if(kind==='shape')p.look.shape=id;else p.look.color=id;
    save();SFX.coin();toast(`買到「${it.name}」，已經換上了`);go('shop',tab)});
  const pull=$('#pull');if(pull)pull.onclick=()=>{
    const cost=price(100);if(p.coins<cost)return;p.coins-=cost;if(useCp){p.coupons--;SCREENS.shop._cp=false}
    const tot=PETS.reduce((a,x)=>a+x.w,0);let r=Math.random()*tot;const got=PETS.find(x=>(r-=x.w)<0)||PETS[0];
    const dup=p.pets.includes(got.id);if(!dup)p.pets.push(got.id);else p.coins+=20;
    if(!p.pet)p.pet=got.id;save();checkAch();SFX.win();
    const s=sheet(`<div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center"><span class="rar ${got.rar}">${got.rar}</span>${petImg(got,150)}<h2>${got.name}</h2><p class="muted" style="margin:0">${got.set}${dup?' · 已經有了，退回 20 點 Eureka':''}</p><div class="row"><button class="btn ghost" data-eq>放到答題畫面</button><button class="btn" data-ok>好</button></div></div>`,{center:true});
    speak(got.name);
    $('[data-eq]',s).onclick=()=>{p.pet=got.id;save();s.remove();toast('已經放上答題畫面');go('shop','gacha')};
    $('[data-ok]',s).onclick=()=>{s.remove();go('shop','gacha')};
  };
};
SCREENS.shop._cp=false;
SCREENS.closet=()=>{
  const p=P();p.look.acc=p.look.acc||{};
  const owned=ACC.filter(a=>p.owned.includes(a.id));
  app.innerHTML=`${topbar('造型間',{back:true})}<div class="stage"><div class="wrap" style="max-width:820px">
   <div class="card row" style="justify-content:center;gap:24px"><div style="width:180px">${avatarSVG(p.look)}</div><div><h2>${esc(p.name)}</h2><p class="muted">點下面的東西換上或拿下。</p>${p.pet?`<div class="row">${petImg(PETS.find(x=>x.id===p.pet),56)}<small class="muted">答題畫面的小夥伴</small></div>`:''}</div></div>
   <h3>外形</h3><div class="row">${SHAPES.filter(s=>!s.price||p.owned.includes('shape:'+s.id)).map(s=>`<button class="sel-av ${p.look.shape===s.id?'on':''}" data-shape="${s.id}" style="width:76px">${avatarSVG({...p.look,shape:s.id})}<small>${s.name}</small></button>`).join('')}</div>
   <h3>顏色</h3><div class="swatches">${COLORS.filter(c=>!c.price||p.owned.includes('color:'+c.id)).map(c=>`<button class="sw ${p.look.color===c.id?'on':''}" data-color="${c.id}" style="background:${c.id}" aria-label="${c.name}"></button>`).join('')}</div>
   <h3>配件</h3>${owned.length?`<div class="row">${owned.map(a=>`<button class="sel-av ${p.look.acc[a.slot]===a.id?'on':''}" data-acc="${a.id}" style="width:84px">${avatarSVG({...p.look,acc:{[a.slot]:a.id}})}<small>${a.name}</small></button>`).join('')}</div>`:'<p class="muted">還沒有配件。到商城買，或在機會卡抽到。</p>'}
   <h3>答題小夥伴</h3>${p.pets.length?`<div class="row">${uniq(p.pets).map(id=>{const x=PETS.find(q=>q.id===id);return `<button class="sel-av ${p.pet===id?'on':''}" data-pet="${id}" style="width:96px">${petImg(x,72)}<small>${x.rar}</small></button>`}).join('')}<button class="sel-av ${!p.pet?'on':''}" data-pet="" style="width:96px;height:100px">不帶</button></div>`:'<p class="muted">到商城扭歷史道具，就能帶著它答題。</p>'}
  </div></div>`;
  bindTop();
  $$('[data-shape]').forEach(b=>b.onclick=()=>{p.look.shape=b.dataset.shape;save();go('closet')});
  $$('[data-color]').forEach(b=>b.onclick=()=>{p.look.color=b.dataset.color;save();go('closet')});
  $$('[data-acc]').forEach(b=>b.onclick=()=>{const a=ACC.find(x=>x.id===b.dataset.acc);p.look.acc[a.slot]=p.look.acc[a.slot]===a.id?null:a.id;save();go('closet')});
  $$('[data-pet]').forEach(b=>b.onclick=()=>{p.pet=b.dataset.pet||null;save();go('closet')});
};
function symCell(s,p){const st=p.stats[s];const a=acc(st);const cls=!st?'':mastered(s)?'m':a<.6&&st.a>=3?'lo':'seen';return `<div class="symc ${cls}" title="${s}">${s}<small>${st?Math.round(a*100)+'%':'—'}</small></div>`}
SCREENS.album=()=>{
  const p=P();
  app.innerHTML=`${topbar('收集冊',{back:true})}<div class="stage"><div class="wrap">
   <div class="card"><div class="row" style="justify-content:space-between"><h3>找回的注音符號</h3><span class="muted small">熟練：答 4 次以上、正確率八成</span></div>
    <p class="muted small" style="margin:6px 0 10px">聲母</p><div class="symgrid">${SHENG.map(s=>symCell(s,p)).join('')}</div>
    <p class="muted small" style="margin:14px 0 10px">介音與韻母</p><div class="symgrid">${YUNALL.map(s=>symCell(s,p)).join('')}</div>
    <div class="row small muted" style="margin-top:10px"><span class="symc m" style="width:22px;height:22px;font-size:0"></span>熟練<span class="symc seen" style="width:22px;height:22px;font-size:0"></span>練習中<span class="symc lo" style="width:22px;height:22px;font-size:0"></span>要加油</div></div>
   <div class="card"><h3 style="margin-bottom:10px">島嶼徽章</h3><div class="badges">${ISLANDS.filter(i=>!i.dojo).map(i=>{const m=islandMedal(p,i);return `<div class="badge ${m?'on':'off'}"><span class="bi">${m?`<span class="medal ${m}" style="width:42px;height:42px">${MEDALTXT[m]}</span>`:'🔒'}</span><span><b>${i.name}</b><small>${m?MEDALTXT[m]+'牌':`${i.nodes.filter(n=>p.cleared.includes(n.id)).length}/${i.nodes.length} 關`}</small></span></div>`}).join('')}
     <div class="badge ${p.medal?'on':'off'}"><span class="bi">${p.medal?`<span class="medal ${['','bronze','silver','gold'][p.medal]}" style="width:42px;height:42px">${['','銅','銀','金'][p.medal]}</span>`:'🔒'}</span><span><b>能力檢測</b><small>${p.medal?['','銅牌','銀牌','金牌'][p.medal]:'挑戰塔最後一關'}</small></span></div></div></div>
   <div class="card"><h3 style="margin-bottom:10px">成就 ${p.ach.length}/${ACHS.length}</h3><div class="badges">${ACHS.map(a=>`<div class="badge ${p.ach.includes(a.id)?'on':'off'}"><span class="bi" style="font-family:var(--zy)">${p.ach.includes(a.id)?a.ic:'🔒'}</span><span><b>${a.name}</b><small>${a.desc}</small></span></div>`).join('')}</div></div>
   <div class="card"><h3 style="margin-bottom:10px">歷史道具 ${uniq(p.pets).length}/${PETS.length}</h3><div class="items">${PETS.map(x=>{const own=p.pets.includes(x.id);return `<div class="item-c" style="${own?'':'opacity:.4'}">${own?petImg(x,72):'<span style="width:72px;height:72px;display:grid;place-items:center;font-size:2rem">?</span>'}<span class="rar ${x.rar}">${x.rar}</span><b class="small">${own?x.name:'???'}</b></div>`}).join('')}</div></div>
  </div></div>`;
  bindTop();
};

/* ============ parent / teacher ============ */
SCREENS.gate=()=>{
  const a=6+rnd(4),b=6+rnd(4);
  app.innerHTML=`<div class="stage"><div class="wrap" style="max-width:420px;padding-top:40px"><div class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2>家長／老師專區</h2><p class="muted" style="margin:0">請大人回答：${a} × ${b} = ?</p>
    <input id="gans" type="number" inputmode="numeric" autocomplete="off"><div class="row"><button class="btn ghost" id="gb">返回</button><button class="btn" id="gok">進入</button></div><p id="gerr" class="small" style="color:var(--bad);margin:0" hidden>答案不對，再試一次。</p></div></div></div>`;
  $('#gans').focus();
  const ok=()=>{if(+$('#gans').value===a*b)go('teacher');else $('#gerr').hidden=false};
  $('#gok').onclick=ok;$('#gans').onkeydown=e=>{if(e.key==='Enter')ok()};$('#gb').onclick=()=>go('profiles');
};
SCREENS.teacher=(pid)=>{
  const ps=DB.profiles;const p=ps.find(x=>x.id===pid)||ps[0];
  const fmtMin=s=>Math.round(s/60);
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return dkey(d)});
  const mx=p?Math.max(1,...days.map(d=>p.time[d]||0)):1;
  const tot=p?Object.values(p.stats).reduce((a,s)=>({a:a.a+s.a,c:a.c+s.c}),{a:0,c:0}):{a:0,c:0};
  const conf=p?Object.entries(p.confuse).sort((a,b)=>b[1]-a[1]).slice(0,8):[];
  const sel=(id,opts,v)=>`<select id="${id}">${opts.map(([k,n])=>`<option value="${k}" ${String(v)===String(k)?'selected':''}>${n}</option>`).join('')}</select>`;
  app.innerHTML=`<header class="top"><button class="ibtn" id="tb" aria-label="返回">${ICON.back}</button><h1>家長／老師專區</h1></header><div class="stage"><div class="wrap">
   ${ps.length?`<div class="tabs">${ps.map(x=>`<button class="tab ${x===p?'on':''}" data-p="${x.id}">${esc(x.name)}</button>`).join('')}</div>
   <div class="tgrid">
     <div class="card stat"><small>累積練習</small><b>${fmtMin(p.totalSec)} 分</b></div>
     <div class="card stat"><small>今天</small><b>${fmtMin(p.time[today()]||0)} 分</b></div>
     <div class="card stat"><small>已過關</small><b>${p.cleared.length} 關</b></div>
     <div class="card stat"><small>整體正確率</small><b>${tot.a?Math.round(tot.c/tot.a*100)+'%':'—'}</b></div>
     <div class="card stat"><small>熟練符號</small><b>${ALLSYM.filter(s=>{const st=p.stats[s];return st&&st.a>=4&&st.c/st.a>=.8}).length}/37</b></div>
   </div>
   <div class="card"><h3>最近 7 天練習分鐘</h3><div class="bars" style="margin-top:12px">${days.map(d=>`<div><span>${fmtMin(p.time[d]||0)}</span><i style="height:${Math.round((p.time[d]||0)/mx*100)}%"></i><span>${d.slice(5).replace('-','/')}</span></div>`).join('')}</div></div>
   <div class="card"><div class="row" style="justify-content:space-between"><h3>37 個符號正確率</h3><span class="muted small">灰色表示還沒練到</span></div>
     <div class="symgrid" style="margin-top:12px">${ALLSYM.map(s=>{const st=p.stats[s];const a=acc(st);return `<div class="symc ${!st?'':a>=.8?'m':a>=.6?'seen':'lo'}">${s}<small>${st?`${Math.round(a*100)}% · ${st.a}`:'—'}</small></div>`}).join('')}</div></div>
   <div class="tgrid">
     <div class="card"><h3>聲調正確率</h3>${[1,2,3,4].map(t=>{const st=p.tones[t];return `<div class="setrow"><span>${TONENAME[t]}</span><b style="font-variant-numeric:tabular-nums">${st?Math.round(st.c/st.a*100)+'%（'+st.a+' 題）':'—'}</b></div>`}).join('')}</div>
     <div class="card"><h3>常見混淆</h3>${conf.length?conf.map(([k,n])=>{const[a,b]=k.split('>');return `<div class="setrow"><span>把 <b class="zh" style="font-size:1.3em">${a}</b> 當成 <b class="zh" style="font-size:1.3em">${b}</b></span><b>${n} 次</b></div>`}).join(''):'<p class="muted">目前沒有明顯的混淆。</p>'}</div>
   </div>
   <div class="card"><h3>各島進度</h3>${ISLANDS.filter(i=>!i.dojo).map(i=>`<div class="setrow"><span>${i.name}</span><span>${i.nodes.filter(n=>p.cleared.includes(n.id)).length}/${i.nodes.length} 關 · ${i.nodes.reduce((a,n)=>a+(p.stars[n.id]||0),0)} 星 ${islandMedal(p,i)?`<span class="medal ${islandMedal(p,i)}">${MEDALTXT[islandMedal(p,i)]}</span>`:''}</span></div>`).join('')}
     <div class="setrow"><span>能力檢測</span><span>${['未完成','銅牌','銀牌','金牌'][p.medal||0]}</span></div></div>`:'<p class="card muted">還沒有冒險家。回到首頁新增一位，開始玩之後這裡會出現學習紀錄。</p>'}
   <div class="card"><h3>設定（這台裝置）</h3>
     <div class="setrow"><label for="s-rate">語音速度</label>${sel('s-rate',[[.65,'慢'],[.85,'標準'],[1,'快']],S().rate)}</div>
     <div class="setrow"><label for="s-mode">符號讀音方式</label>${sel('s-mode',[['proxy','用代表字唸（玻、坡、摸）'],['raw','直接唸符號']],S().symMode)}</div>
     <div class="setrow"><label for="s-opts">選項數量</label>${sel('s-opts',[[3,'3 個（較簡單）'],[4,'4 個']],S().opts)}</div>
     <div class="setrow"><label for="s-goal">每日目標</label>${sel('s-goal',[[10,'10 分鐘'],[15,'15 分鐘'],[20,'20 分鐘']],S().goal)}</div>
     <div class="setrow"><label for="s-lock">商城開門條件</label>${sel('s-lock',[[0,'隨時可逛'],[5,'今天練滿 5 分鐘'],[10,'今天練滿 10 分鐘']],S().shopLockMin)}</div>
     <div class="setrow"><label for="s-dlg">角色對話朗讀</label>${sel('s-dlg',[[1,'開'],[0,'關']],S().readDialog?1:0)}</div>
     <div class="setrow"><label for="s-un">開放所有島嶼與關卡</label>${sel('s-un',[[0,'依進度開放'],[1,'全部開放（老師備課用）']],S().unlockAll?1:0)}</div>
     <div class="setrow"><span>中文語音</span><span class="muted small">${HASZH?`使用「${esc(VOICE.name)}」`:'這台裝置找不到中文語音，聽音題可能沒聲音。可在系統設定加裝「中文（台灣）」語音。'}</span></div>
     <div class="setrow"><span>試聽</span><button class="btn ghost" id="try" style="padding:8px 14px">${ICON.sound} ㄅ ㄆ ㄇ ㄈ</button></div>
   </div>
   ${p?`<div class="card row" style="justify-content:space-between"><span class="muted">刪除「${esc(p.name)}」的所有紀錄</span><button class="btn ghost" id="del" style="color:var(--bad)">刪除冒險家</button></div>`:''}
   <p class="muted small">學習紀錄只存在這台裝置的瀏覽器裡。換裝置或清除瀏覽資料後會重新開始。</p>
  </div></div>`;
  $('#tb').onclick=()=>go('profiles');
  $$('[data-p]').forEach(b=>b.onclick=()=>go('teacher',b.dataset.p));
  const bind=(id,f)=>{$('#'+id).onchange=e=>{f(e.target.value);save()}};
  bind('s-rate',v=>S().rate=+v);bind('s-mode',v=>S().symMode=v);bind('s-opts',v=>S().opts=+v);bind('s-goal',v=>S().goal=+v);bind('s-lock',v=>S().shopLockMin=+v);bind('s-dlg',v=>S().readDialog=v==='1');bind('s-un',v=>S().unlockAll=v==='1');
  $('#try').onclick=()=>sayList([...'ㄅㄆㄇㄈ'].map(symSound));
  const del=$('#del');if(del)del.onclick=()=>{
    const s=sheet(`<h2>確定刪除「${esc(p.name)}」？</h2><p class="muted" style="margin:0">星星、Eureka、收集冊都會消失，不能復原。</p><div class="row"><button class="btn ghost" data-n>取消</button><button class="btn" data-y style="background:var(--bad);box-shadow:0 4px 0 #A9483D">刪除</button></div>`,{center:true});
    $('[data-n]',s).onclick=()=>s.remove();$('[data-y]',s).onclick=()=>{DB.profiles=DB.profiles.filter(x=>x!==p);if(DB.cur===p.id)DB.cur=null;save();s.remove();go('teacher')};
  };
};

/* ============ boot ============ */
load();
if(DB.cur&&P())go('world');else go('profiles');
</script>
